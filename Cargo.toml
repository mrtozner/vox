[workspace]
members = ["python"]

[package]
name = "vox"
version = "0.2.0"
edition = "2024"
authors = ["Mert Ozoner"]
description = "Local-first voice AI framework. Whisper STT, Kokoro/Pocket TTS, Silero VAD. Zero cloud dependencies."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mrtozner/vox"
homepage = "https://github.com/mrtozner/vox"
documentation = "https://docs.rs/vox"
readme = "README.md"
keywords = ["voice", "speech", "whisper", "ai", "edge"]
categories = ["multimedia::audio", "science::robotics"]
rust-version = "1.85"
exclude = [
    "models/", "plans/", "research/", "scripts/", "vendor/",
    "*.wav", "Dockerfile.static", ".cargo/", ".github/", "python/",
]

[dependencies]
async-trait = "0.1"
cpal = "0.15"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
whisper-rs = { version = "0.15", optional = true }
kokoro-tts = { version = "0.3.2", optional = true }
ort = { version = "=2.0.0-rc.11", optional = true, features = ["half"] }
ndarray = { version = "0.16", optional = true }
rodio = { version = "0.20", optional = true }
pocket-tts = { version = "0.6", optional = true }
chatterbox-rs = { path = "vendor/cbx", optional = true }
candle-core = { version = "0.9", optional = true }
hound = "3.5"
tracing = "0.1"
thiserror = "2"
anyhow = "1"
rubato = "0.16"

# CLI dependencies
clap = { version = "4.5", features = ["derive"], optional = true }
dirs = { version = "5.0", optional = true }
indicatif = { version = "0.17", optional = true }
reqwest = { version = "0.12", features = ["stream", "json"], optional = true }
tracing-subscriber = { version = "0.3", optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }

# Server dependencies
axum = { version = "0.8", optional = true, features = ["ws"] }
futures-util = { version = "0.3", optional = true }
tower-http = { version = "0.6", optional = true, features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
default = ["whisper", "silero"]
whisper = ["dep:whisper-rs"]
silero = ["dep:ort", "dep:ndarray"]
kokoro = ["dep:kokoro-tts", "dep:ort", "dep:rodio"]
piper = ["dep:ort"]  # TODO: piper TTS backend not yet implemented
tts = ["dep:rodio"]
pocket = ["dep:pocket-tts", "dep:candle-core", "dep:rodio"]
pocket-metal = ["pocket", "pocket-tts/metal", "candle-core/metal"]
pocket-mkl = ["pocket", "pocket-tts/mkl"]
chatterbox = ["dep:chatterbox-rs", "dep:ort", "dep:ndarray", "dep:rodio"]
chatterbox-coreml = ["chatterbox", "chatterbox-rs/coreml"]
cli = [
    "dep:clap", "dep:dirs", "dep:indicatif", "dep:reqwest",
    "dep:tracing-subscriber", "dep:tokio-util",
    "dep:serde", "dep:serde_json",
    "whisper", "silero",
]
server = [
    "dep:axum", "dep:tower-http", "dep:serde", "dep:serde_json",
    "dep:dirs", "dep:futures-util",
]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = "0.3"

[[bin]]
name = "vox"
path = "src/bin/vox.rs"
required-features = ["cli"]

[[bench]]
name = "resampler_bench"
harness = false

[[bench]]
name = "vad_bench"
harness = false
required-features = ["silero"]

[[bench]]
name = "stt_bench"
harness = false
required-features = ["whisper"]

[[bench]]
name = "tts_bench"
harness = false
required-features = ["kokoro"]

[[bench]]
name = "pipeline_bench"
harness = false
required-features = ["whisper", "silero"]

[[bench]]
name = "chatterbox_bench"
harness = false
required-features = ["chatterbox"]

[[bench]]
name = "tts_comparison_bench"
harness = false

[[example]]
name = "simple_listen"
required-features = ["whisper", "silero"]

[[example]]
name = "vad_only"
required-features = ["silero"]

[[example]]
name = "voice_assistant"
required-features = ["whisper", "silero", "kokoro"]

[[example]]
name = "tts_speak"
required-features = ["kokoro"]

[[example]]
name = "pocket_speak"
required-features = ["pocket"]

[[example]]
name = "chatterbox_speak"
required-features = ["chatterbox"]
