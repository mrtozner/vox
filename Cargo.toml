[[test]]
name = "privacy_ledger_tests"
path = "tests/privacy_ledger_tests.rs"
required-features = ["server"]

[[test]]
name = "offline_server_tests"
path = "tests/offline_server_tests.rs"
required-features = ["server"]

# Engine on a caller-owned audio source; the `server` part is cfg-gated.
[[test]]
name = "embedding_tests"
path = "tests/embedding_tests.rs"

[[test]]
name = "offline_cli_tests"
path = "tests/offline_cli_tests.rs"
required-features = ["cli"]

[[bin]]
name = "vox"
path = "src/bin/vox.rs"
required-features = ["cli"]

