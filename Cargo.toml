[workspace]
members = ["python"]
exclude = ["vendor/sherpa-sys"]

[package]
# Published name. `vox` on crates.io belongs to an unrelated project, so the
# package is `vox-voice`; the library and the binary are both still `vox`
# (see [lib] and [[bin]] below), so `use vox::...` and the `vox` command do
# not change.
name = "vox-voice"
version = "0.6.0"
edition = "2024"
authors = ["Mert Ozoner"]
description = "Local-first voice AI framework. Whisper STT, Kokoro/Piper TTS, Silero VAD. Zero cloud dependencies."
# License of the source code. A binary built with the `piper` feature links
# espeak-ng (GPL-3.0-or-later) and is distributed under GPL-3.0; see NOTICE.
license = "MIT OR Apache-2.0"
repository = "https://github.com/mrtozner/vox"
homepage = "https://github.com/mrtozner/vox"
documentation = "https://github.com/mrtozner/vox#readme"
readme = "README.md"
keywords = ["voice", "speech", "whisper", "ai", "edge"]
categories = ["multimedia::audio", "science::robotics"]
# Floor set by ort 2.0.0-rc.11 (rust-version 1.88). CI checks it.
rust-version = "1.88"
# Not publishable yet: piper-rs, qwen3-tts, chatterbox-rs and sherpa-sys are
# path dependencies under vendor/. Install from git or a release archive.
publish = false
exclude = [
    "models/", "plans/", "research/", "scripts/", "vendor/",
    "*.wav", ".github/", "python/",
]

[lib]
name = "vox"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
# Microphone capture; only with the `mic` feature (on by default).
cpal = { version = "0.15", optional = true }
# The library core needs a runtime handle, channels, `select!` and timers.
# Everything else is switched on by the feature that uses it (see [features]):
# the binary's multi-threaded runtime, signals, fs, net, process.
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
tokio-stream = "0.1"
whisper-rs = { version = "0.15", optional = true }
kokoro-tts = { version = "0.3.2", optional = true }
ort = { version = "=2.0.0-rc.11", optional = true, features = ["half"] }
ndarray = { version = "0.16", optional = true }
rodio = { version = "0.20", optional = true }
pocket-tts = { version = "0.6", optional = true }
chatterbox-rs = { path = "vendor/cbx", optional = true }
piper-rs = { path = "vendor/piper-rs", optional = true }
sherpa-sys = { path = "vendor/sherpa-sys", optional = true }
candle-core = { version = "0.9", optional = true }
qwen3-tts = { path = "vendor/qwen3-tts", optional = true }
hound = "3.5"
tracing = "0.1"
thiserror = "2"
anyhow = "1"
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"], optional = true }
sha2 = { version = "0.10", optional = true }

# CLI dependencies
clap = { version = "4.5", features = ["derive"], optional = true }
dirs = { version = "5.0", optional = true }
indicatif = { version = "0.17", optional = true }
reqwest = { version = "0.12", features = ["stream", "json"], optional = true }
tracing-subscriber = { version = "0.3", optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
toml = { version = "0.8", optional = true }

# Server dependencies
axum = { version = "0.8", optional = true, features = ["ws", "multipart"] }
futures-util = { version = "0.3", optional = true }
tower-http = { version = "0.6", optional = true, features = ["cors", "trace", "timeout"] }

# Auto-GPU: when `qwen3` or `pocket` features are active on macOS, Metal is
# enabled automatically via Cargo's additive feature merging. The explicit
# `qwen3-metal` / `pocket-metal` features still work but are no longer needed
# on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.9", optional = true, features = ["metal"] }
qwen3-tts = { path = "vendor/qwen3-tts", optional = true, features = ["metal"] }
pocket-tts = { version = "0.6", optional = true, features = ["metal"] }

[features]
default = ["whisper", "silero", "mic", "signal"]
# Microphone capture through cpal: `AudioCapture` and `VoxBuilder::build()`.
# Without it the engine is fed with `VoxBuilder::build_with_source()`.
mic = ["dep:cpal"]
# `Vox::listen()` stops on Ctrl-C. Without it only the end of the audio
# source (or `Vox::listen_until()`) stops the pipeline.
signal = ["tokio/signal"]
whisper = ["dep:whisper-rs"]
distil-whisper = ["whisper"]
silero = ["dep:ort", "dep:ndarray"]
kokoro = ["dep:kokoro-tts", "dep:ort", "dep:rodio", "tokio/fs"]
sherpa = ["dep:sherpa-sys"]
piper = ["dep:piper-rs", "dep:ort", "dep:rodio"]
tts = ["dep:rodio"]
pocket = ["dep:pocket-tts", "dep:candle-core", "dep:rodio"]
pocket-metal = ["pocket", "pocket-tts/metal", "candle-core/metal"]
pocket-mkl = ["pocket", "pocket-tts/mkl"]
chatterbox = ["dep:chatterbox-rs", "dep:ort", "dep:ndarray", "dep:rodio"]
chatterbox-coreml = ["chatterbox", "chatterbox-rs/coreml"]
qwen3 = ["dep:qwen3-tts", "qwen3-tts/cpu", "dep:candle-core", "dep:rodio"]
qwen3-cuda = ["qwen3", "qwen3-tts/cuda", "candle-core/cuda"]
qwen3-metal = ["qwen3", "qwen3-tts/metal", "candle-core/metal"]
diarization = ["dep:ort", "dep:ndarray", "dep:sqlx", "dep:sha2"]
cli = [
    "dep:clap", "dep:dirs", "dep:indicatif", "dep:reqwest",
    "dep:tracing-subscriber", "dep:tokio-util", "dep:toml",
    "dep:sha2",
    "whisper", "silero", "mic", "signal",
    "tokio/rt-multi-thread", "tokio/fs", "tokio/io-util", "tokio/process",
]
server = [
    "dep:axum", "dep:tower-http",
    "dep:dirs", "dep:futures-util",
    "dep:reqwest", "dep:tokio-util",
    "diarization", "silero", "signal",
    "tokio/net", "tokio/process",
]
# The feature set of the release binaries (.github/workflows/release.yml).
# It includes `piper`, which links espeak-ng (GPL-3.0-or-later), so a binary
# built with `dist` is distributed under GPL-3.0. See NOTICE.
dist = ["cli", "server", "kokoro", "piper"]

# `cargo build --release` and `cargo install` produce the shipped binary:
# thin LTO and a single codegen unit for speed and size, symbols stripped.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = "0.3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.12", features = ["json"] }

