[package]
name = "vox-python"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "_vox_voice"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
once_cell = "1"
tokio = { version = "1", features = ["full"] }
hound = "3.5"
dirs = "5.0"
vox = { path = "..", features = ["whisper", "silero", "kokoro"] }
