<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vox</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --bg-primary: #0a0a0a;
    --bg-secondary: #141414;
    --bg-tertiary: #1e1e1e;
    --accent: #4ade80;
    --accent-dim: #166534;
    --error: #ef4444;
    --warning: #f59e0b;
    --text-primary: #e0e0e0;
    --text-muted: #555;
    --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
    --radius: 8px;
}

body {
    font-family: var(--font-mono);
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
}

/* ── Header ───────────────────────────────────────────────── */
.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid var(--bg-tertiary);
    flex-shrink: 0;
}
.header-brand { font-size: 18px; font-weight: 700; letter-spacing: 2px; }
.header-brand span { color: var(--text-muted); font-weight: 400; font-size: 12px; margin-left: 8px; }
.header-health { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
.health-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-muted);
    transition: background 0.3s;
}
.health-dot.ok { background: var(--accent); }
.health-dot.err { background: var(--error); }

/* ── Tab Bar ──────────────────────────────────────────────── */
.tab-bar {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--bg-tertiary);
    flex-shrink: 0;
    overflow-x: auto;
}
.tab-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 10px 20px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.2s, border-color 0.2s;
    white-space: nowrap;
}
.tab-btn:hover { color: var(--text-primary); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ── Tab Content ──────────────────────────────────────────── */
.tab-content { flex: 1; overflow: hidden; display: none; flex-direction: column; }
.tab-content.active { display: flex; }

/* ── Listen Tab ───────────────────────────────────────────── */
.listen-controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 16px;
    gap: 12px;
    flex-shrink: 0;
}
.mic-btn {
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 2px solid var(--accent-dim);
    background: var(--bg-secondary);
    color: var(--accent-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s, color 0.2s, box-shadow 0.2s;
    position: relative;
}
.mic-btn:hover { border-color: var(--accent); color: var(--accent); }
.mic-btn.recording {
    border-color: var(--accent);
    color: var(--accent);
    animation: mic-pulse 1.5s ease-in-out infinite;
}
@keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.3); }
    50% { box-shadow: 0 0 0 12px rgba(74, 222, 128, 0); }
}
.mic-btn svg { width: 28px; height: 28px; fill: currentColor; }
.listen-status { font-size: 12px; color: var(--text-muted); min-height: 18px; }
.listen-status.active { color: var(--accent); }
.listen-status.transcribing { color: var(--warning); animation: transcribe-pulse 1s ease-in-out infinite; }
@keyframes transcribe-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

.audio-meter {
    width: 120px;
    height: 4px;
    background: var(--bg-tertiary);
    border-radius: 2px;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.3s;
}
.audio-meter.visible { opacity: 1; }
.audio-meter-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.1s;
}

.transcript-area {
    flex: 1;
    overflow-y: auto;
    padding: 0 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.transcript-entry {
    background: var(--bg-secondary);
    border: 1px solid var(--bg-tertiary);
    border-radius: var(--radius);
    padding: 10px 14px;
}
.transcript-text { font-size: 14px; word-break: break-word; }
.transcript-meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.transcript-partial .transcript-text { color: var(--text-muted); font-style: italic; }
.transcript-placeholder .transcript-text { animation: dot-pulse 1.5s ease-in-out infinite; }
@keyframes dot-pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
.transcript-copy-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: none;
    border: 1px solid var(--bg-tertiary);
    border-radius: 4px;
    color: var(--text-muted);
    font-size: 12px;
    padding: 2px 6px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s, color 0.2s, border-color 0.2s;
    font-family: var(--font-mono);
    line-height: 1;
}
.transcript-entry:hover .transcript-copy-btn { opacity: 1; }
.transcript-copy-btn:hover { color: var(--accent); border-color: var(--accent); }
.transcript-clear {
    align-self: flex-end;
    margin-right: 20px;
    margin-bottom: 8px;
}

/* ── Diarization (Listen Tab) ─────────────────────────────── */
.diarize-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-muted);
    cursor: pointer;
    user-select: none;
    padding: 4px 10px;
    border: 1px solid var(--bg-tertiary);
    border-radius: 999px;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
}
.diarize-toggle:hover { color: var(--text); border-color: var(--accent-dim); }
.diarize-toggle.on { color: var(--accent); border-color: var(--accent); }
.diarize-toggle.disabled { opacity: 0.35; cursor: not-allowed; }
.diarize-toggle input { display: none; }
.diarize-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--bg-tertiary);
    transition: background 0.15s;
}
.diarize-toggle.on .diarize-dot { background: var(--accent); }

.listen-body {
    display: grid;
    grid-template-columns: 1fr;
    flex: 1;
    min-height: 0;
    gap: 0;
}
.listen-body.with-sidebar { grid-template-columns: 1fr 220px; }
.speakers-sidebar {
    border-left: 1px solid var(--bg-tertiary);
    padding: 12px 14px;
    overflow-y: auto;
    display: none;
    flex-direction: column;
    gap: 6px;
}
.listen-body.with-sidebar .speakers-sidebar { display: flex; }
.speakers-sidebar h3 {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 0 6px 0;
    font-weight: 600;
}
.speakers-sidebar-empty {
    font-size: 11px;
    color: var(--text-muted);
    font-style: italic;
    padding: 8px 0;
}
.speaker-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
}
.speaker-row:hover { background: var(--bg-secondary); border-color: var(--bg-tertiary); }
.speaker-swatch {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
}
.speaker-name {
    flex: 1;
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.speaker-forget {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 14px;
    padding: 2px 4px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
}
.speaker-row:hover .speaker-forget { opacity: 1; }
.speaker-forget:hover { color: var(--error, #ff6b6b); }
.speaker-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--bg-tertiary);
    color: var(--text);
    margin-right: 6px;
    vertical-align: middle;
}
.speaker-badge .speaker-swatch { width: 6px; height: 6px; }
.transcript-entry[data-speaker] { border-left: 2px solid var(--speaker-color, var(--bg-tertiary)); }

/* ── Speak Tab ────────────────────────────────────────────── */
.speak-container {
    display: flex;
    flex-direction: column;
    padding: 20px;
    gap: 16px;
    flex: 1;
}
.speak-container textarea {
    flex: 1;
    min-height: 120px;
    resize: vertical;
    background: var(--bg-secondary);
    border: 1px solid var(--bg-tertiary);
    border-radius: var(--radius);
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 14px;
    padding: 12px;
    outline: none;
    transition: border-color 0.2s;
}
.speak-container textarea:focus { border-color: var(--accent-dim); }
.speak-container textarea::placeholder { color: var(--text-muted); }
.speak-row {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
}
.speak-row select {
    flex: 1;
    min-width: 140px;
    background: var(--bg-secondary);
    border: 1px solid var(--bg-tertiary);
    border-radius: var(--radius);
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 8px 12px;
    outline: none;
    cursor: pointer;
}
.speak-row select:focus { border-color: var(--accent-dim); }
.audio-player { margin-top: 8px; }
.audio-player audio { width: 100%; outline: none; }

/* ── Chat Tab ─────────────────────────────────────────────── */
.chat-container { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
.chat-settings {
    display: flex;
    gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--bg-tertiary);
    flex-wrap: wrap;
    flex-shrink: 0;
}
.chat-settings label { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
.chat-settings input, .chat-settings select {
    background: var(--bg-secondary);
    border: 1px solid var(--bg-tertiary);
    border-radius: var(--radius);
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 6px 10px;
    outline: none;
}
.chat-settings input:focus, .chat-settings select:focus { border-color: var(--accent-dim); }
.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.chat-msg { max-width: 80%; display: flex; flex-direction: column; gap: 2px; }
.chat-msg.user { align-self: flex-end; }
.chat-msg.assistant { align-self: flex-start; }
.chat-msg-sender { font-size: 11px; color: var(--text-muted); }
.chat-msg-text {
    background: var(--bg-secondary);
    border: 1px solid var(--bg-tertiary);
    border-radius: var(--radius);
    padding: 10px 14px;
    font-size: 14px;
    word-break: break-word;
    white-space: pre-wrap;
}
.chat-msg.user .chat-msg-text { background: var(--accent-dim); border-color: var(--accent-dim); }
.chat-retry-btn {
    background: none;
    border: 1px solid var(--error);
    border-radius: var(--radius);
    color: var(--error);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 3px 10px;
    cursor: pointer;
    margin-top: 4px;
    transition: background 0.2s, color 0.2s;
    align-self: flex-end;
}
.chat-retry-btn:hover { background: var(--error); color: #fff; }
.chat-thinking { font-size: 12px; color: var(--text-muted); padding: 0 20px; flex-shrink: 0; min-height: 20px; }
.chat-input-bar {
    display: flex;
    gap: 8px;
    padding: 12px 20px;
    border-top: 1px solid var(--bg-tertiary);
    flex-shrink: 0;
}
.chat-input-bar input {
    flex: 1;
    background: var(--bg-secondary);
    border: 1px solid var(--bg-tertiary);
    border-radius: var(--radius);
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
}
.chat-input-bar input:focus { border-color: var(--accent-dim); }
.chat-input-bar input::placeholder { color: var(--text-muted); }
.chat-mic-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid var(--bg-tertiary);
    background: var(--bg-secondary);
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s, color 0.2s;
    flex-shrink: 0;
}
.chat-mic-btn:hover { border-color: var(--accent-dim); color: var(--accent); }
.chat-mic-btn.recording { border-color: var(--accent); color: var(--accent); animation: mic-pulse 1.5s ease-in-out infinite; }
.chat-mic-btn svg { width: 18px; height: 18px; fill: currentColor; }

/* ── Live Talk Tab ────────────────────────────────────────── */
.livetalk-container { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
.livetalk-settings {
    display: flex;
    gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--bg-tertiary);
    flex-wrap: wrap;
    flex-shrink: 0;
}
.livetalk-settings label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
}
.livetalk-settings select {
    background: var(--bg-secondary);
    border: 1px solid var(--bg-tertiary);
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 4px;
    outline: none;
    cursor: pointer;
}
.livetalk-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.livetalk-messages:empty::before {
    content: 'Press the mic button to start a live conversation.';
    color: var(--text-muted);
    text-align: center;
    font-size: 13px;
    padding: 20px;
    margin: auto;
}
.live-msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    line-height: 1.5;
    word-wrap: break-word;
}
.live-msg.user {
    align-self: flex-end;
    background: var(--accent-dim);
    color: var(--accent);
}
.live-msg.assistant {
    align-self: flex-start;
    background: var(--bg-secondary);
    border: 1px solid var(--bg-tertiary);
    color: var(--text-primary);
}
.live-msg.assistant.cancelled::after {
    content: ' (interrupted)';
    color: var(--warning);
    font-size: 11px;
    font-style: italic;
}
.live-msg-sender { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
.live-control-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    border-top: 1px solid var(--bg-tertiary);
    flex-shrink: 0;
    flex-wrap: wrap;
}
.live-mic-btn {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
}
.live-mic-btn svg { width: 22px; height: 22px; }
.live-state-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 120px;
}
.live-state-badge {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 2px 0;
    transition: color 0.2s;
}
.live-state-badge.listening { color: var(--accent); }
.live-state-badge.transcribing { color: var(--warning); }
.live-state-badge.thinking { color: var(--warning); animation: transcribe-pulse 1s ease-in-out infinite; }
.live-state-badge.speaking { color: var(--accent); }
.live-state-badge.cancelled { color: var(--error); }
.live-meter {
    height: 4px;
    background: var(--bg-tertiary);
    border-radius: 2px;
    overflow: hidden;
}
.live-meter-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.1s linear;
}
.live-ptt-btn.active {
    background: var(--accent);
    color: var(--bg-primary);
}

/* ── Dashboard Tab ────────────────────────────────────────── */
.dashboard {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    padding: 20px;
    align-content: start;
    overflow-y: auto;
    flex: 1;
}
.dash-card {
    background: var(--bg-secondary);
    border: 1px solid var(--bg-tertiary);
    border-radius: var(--radius);
    padding: 20px;
}
.dash-card-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
.dash-card-value { font-size: 22px; font-weight: 700; }
.dash-card-value.ok { color: var(--accent); }
.dash-card-value.err { color: var(--error); }
.dash-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 13px; }
.dash-row .label { color: var(--text-muted); }
.dash-indicator {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
}
.dash-indicator.loaded { background: var(--accent); }
.dash-indicator.not-loaded { background: var(--text-muted); }

/* ── Status Bar ───────────────────────────────────────────── */
.status-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 8px 20px;
    border-top: 1px solid var(--bg-tertiary);
    font-size: 11px;
    color: var(--text-muted);
    flex-shrink: 0;
    flex-wrap: wrap;
}

/* ── Buttons ──────────────────────────────────────────────── */
.btn {
    background: var(--accent-dim);
    color: var(--accent);
    border: 1px solid var(--accent-dim);
    border-radius: var(--radius);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 8px 20px;
    cursor: pointer;
    transition: background 0.2s, opacity 0.2s;
    white-space: nowrap;
}
.btn:hover { background: #1a7a3a; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-sm { padding: 4px 12px; font-size: 12px; }
.btn-ghost {
    background: transparent;
    border: 1px solid var(--bg-tertiary);
    color: var(--text-muted);
}
.btn-ghost:hover { border-color: var(--text-muted); color: var(--text-primary); }

/* ── Toasts ───────────────────────────────────────────────── */
.toast-container {
    position: fixed;
    top: 12px;
    right: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 1000;
    pointer-events: none;
}
.toast {
    background: var(--bg-tertiary);
    border: 1px solid var(--text-muted);
    border-radius: var(--radius);
    padding: 10px 36px 10px 14px;
    font-size: 13px;
    color: var(--text-primary);
    pointer-events: auto;
    animation: toast-in 0.25s ease-out;
    position: relative;
    max-width: 360px;
    word-break: break-word;
}
.toast.error { border-color: var(--error); }
.toast.warning { border-color: var(--warning); }
.toast-close {
    position: absolute;
    top: 8px;
    right: 10px;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    font-family: var(--font-mono);
}
.toast-close:hover { color: var(--text-primary); }
@keyframes toast-in { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
.toast.dismissing { animation: toast-out 0.2s ease-in forwards; }
@keyframes toast-out { to { opacity: 0; transform: translateX(20px); } }

/* ── Scrollbar ────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ── Responsive ───────────────────────────────────────────── */
@media (max-width: 600px) {
    .header { padding: 10px 14px; }
    .tab-btn { padding: 8px 14px; font-size: 12px; }
    .speak-container, .chat-messages, .dashboard { padding: 14px; }
    .chat-input-bar, .chat-settings { padding: 10px 14px; }
    .chat-msg { max-width: 90%; }
    .dashboard { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
    .mic-btn.recording, .chat-mic-btn.recording { animation: none; }
    .toast { animation: none; }
    .toast.dismissing { animation: none; opacity: 0; }
    .listen-status.transcribing { animation: none; }
    .transcript-placeholder .transcript-text { animation: none; }
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
    <div class="header-brand">vox<span>v0.6.0</span></div>
    <div class="header-health">
        <div class="health-dot" id="healthDot"></div>
        <span id="healthText">--</span>
    </div>
</div>

<!-- Tab Bar -->
<div class="tab-bar">

<!-- Listen Tab -->
<div class="tab-content active" id="tab-listen">
    <div class="listen-controls">

        </button>
        <div class="listen-status" id="listenStatus">Press to start listening</div>
        <div class="audio-meter" id="audioMeter"><div class="audio-meter-fill" id="audioMeterFill"></div></div>

        <aside class="speakers-sidebar" id="speakersSidebar">
            <h3>Speakers</h3>

<!-- Status Bar -->
<div class="status-bar">
    <span id="statusStt">stt: --</span>
    <span id="statusStreaming">streaming: --</span>
    <span id="statusTts">tts: --</span>
    <span id="statusOllama">ollama: --</span>
    <span id="statusUptime">uptime: --</span>
</div>

<!-- Toasts -->
<div class="toast-container" id="toastContainer"></div>

<script>
// ─── 1. STATE & CONFIG ──────────────────────────────────────
const S = {
    activeTab: 'listen',
    listening: false,
    chatMicActive: false,
    audioCtx: null,
    workletNode: null,
    mediaStream: null,
    listenWs: null,
    chatWs: null,
    voicesLoaded: false,
    ollamaModelsLoaded: false,
    voices: [],
    dashPollId: null,
    speechActive: false,
    reconnecting: false,
    synthesizing: false,
    chatBusy: false,
    uptimeBase: 0,
    uptimeReceivedAt: 0,
    statusPollId: null,
    uptimeTickId: null,
    // Diarization session state
    diarizationAvailable: false,
    diarizationOn: false,
    diarizationConsented: false,
    speakers: {}, // id -> {id,name,color}
};

const DIARIZATION_CONSENT_KEY = 'vox.diarization.consented';
try {
    S.diarizationConsented = localStorage.getItem(DIARIZATION_CONSENT_KEY) === '1';
} catch (_e) {
    // localStorage may be unavailable in private browsing; treat as un-consented.
}

const MAX_TOASTS = 3;
const TOAST_DURATION = 5000;
const DASH_POLL_INTERVAL = 5000;
const STATUS_POLL_INTERVAL = 30000;
const WS_RECONNECT_DELAY = 2000;
const CHUNK_SIZE = 4800;

function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
}

function $(id) { return document.getElementById(id); }

// ─── 2. TAB SYSTEM ──────────────────────────────────────────
function initTabs() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });
}

function switchTab(name) {
    if (S.activeTab === name) return;
    S.activeTab = name;

    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-' + name));

    if (name === 'speak' && !S.voicesLoaded) loadVoices();
    if (name === 'chat') {
        if (!S.voicesLoaded) loadVoices();
        loadOllamaModels();
    }
    if (name === 'livetalk') {
        // Fire-and-forget: never await inside switchTab or we'll block
        // the .active class flip and the user sees a blank tab for a
        // beat while voices/models load.
        loadLiveTalkSelectors().catch(() => { /* ignore; toasts handle UX */ });
    }
    if (name === 'dashboard') startDashPolling();
    else stopDashPolling();
}

// ─── 3. TOAST SYSTEM ────────────────────────────────────────
function showToast(message, type) {
    const container = $('toastContainer');
    while (container.children.length >= MAX_TOASTS) {
        container.removeChild(container.firstChild);
    }

    const toast = document.createElement('div');
    toast.className = 'toast' + (type ? ' ' + type : '');
    toast.innerHTML = escapeHtml(message) + '<button class="toast-close" aria-label="Dismiss">&times;</button>';

    const closeBtn = toast.querySelector('.toast-close');
    const dismiss = () => {
        toast.classList.add('dismissing');
        setTimeout(() => toast.remove(), 200);
    };
    closeBtn.addEventListener('click', dismiss);
    setTimeout(dismiss, TOAST_DURATION);

    container.appendChild(toast);
}

// ─── 4. AUDIO WORKLET ───────────────────────────────────────
const processorCode = `
class VoxProcessor extends AudioWorkletProcessor {
    constructor() {
        super();
        this.buffer = new Float32Array(${CHUNK_SIZE});
        this.offset = 0;
    }
    process(inputs) {
        const input = inputs[0][0];
        if (!input) return true;
        for (let i = 0; i < input.length; i++) {
            this.buffer[this.offset++] = input[i];
            if (this.offset >= ${CHUNK_SIZE}) {
                this.port.postMessage(this.buffer.slice(0));
                this.offset = 0;
            }
        }
        return true;
    }
}
registerProcessor('vox-processor', VoxProcessor);
`;

let workletUrl = null;
function getWorkletUrl() {
    if (!workletUrl) {
        workletUrl = URL.createObjectURL(new Blob([processorCode], { type: 'application/javascript' }));
    }
    return workletUrl;
}

async function initAudio() {
    if (S.audioCtx) return;
    S.audioCtx = new AudioContext({ sampleRate: 16000 });
    await S.audioCtx.audioWorklet.addModule(getWorkletUrl());
}

async function startMic(onChunk) {
    if (!window.isSecureContext) {
        showToast('Microphone requires HTTPS or localhost', 'error');
        return false;
    }

    try {
        await initAudio();
        if (S.audioCtx.state === 'suspended') await S.audioCtx.resume();

        S.mediaStream = await navigator.mediaDevices.getUserMedia({
            audio: {
                channelCount: 1,
                sampleRate: 16000,
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true,
            }
        });
    } catch (e) {
        if (e.name === 'NotAllowedError') showToast('Microphone access denied', 'error');
        else if (e.name === 'NotFoundError') showToast('No microphone detected', 'error');
        else showToast('Microphone error: ' + e.message, 'error');
        return false;
    }

    const source = S.audioCtx.createMediaStreamSource(S.mediaStream);
    S.workletNode = new AudioWorkletNode(S.audioCtx, 'vox-processor');
    S.workletNode.port.onmessage = (e) => onChunk(e.data);
    source.connect(S.workletNode);
    S.workletNode.connect(S.audioCtx.destination);
    return true;
}

function stopMic() {
    if (S.workletNode) {
        S.workletNode.disconnect();
        S.workletNode = null;
    }
    if (S.mediaStream) {
        S.mediaStream.getTracks().forEach(t => t.stop());
        S.mediaStream = null;
    }
}

// ─── 5. WEBSOCKET ───────────────────────────────────────────
function connectWs(path, onMessage) {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(proto + '//' + location.host + path);
    ws.binaryType = 'arraybuffer';
    ws.onmessage = (e) => {
        try {
            const data = JSON.parse(e.data);
            onMessage(data);
        } catch (_) { /* ignore non-JSON */ }
    };
    return ws;
}

// ─── 6. LISTEN TAB ──────────────────────────────────────────
function toggleListening() {
    if (S.listening) stopListening();
    else startListening();
}

async function startListening() {
    const btn = $('listenMicBtn');
    const status = $('listenStatus');

    S.listenWs = connectWs('/v1/listen', handleListenEvent);

    S.listenWs.onopen = async () => {
        const ok = await startMic((chunk) => {
            if (S.listenWs && S.listenWs.readyState === WebSocket.OPEN) {
                S.listenWs.send(chunk.buffer);
            }
            updateAudioMeter(chunk);
        });
        if (!ok) {
            S.listenWs.close();
            S.listenWs = null;
            return;
        }
        S.listening = true;
        btn.classList.add('recording');
        status.textContent = 'Listening...';
        status.classList.add('active');
        $('audioMeter').classList.add('visible');
    };

    S.listenWs.onerror = () => {
        showToast('WebSocket connection failed', 'error');
    };

    S.listenWs.onclose = () => {
        if (S.listening && !S.reconnecting) {
            S.reconnecting = true;
            status.textContent = 'Reconnecting...';
            setTimeout(() => {
                S.reconnecting = false;
                if (S.listening) {
                    stopMic();
                    S.listening = false;
                    btn.classList.remove('recording');
                    startListening();
                }
            }, WS_RECONNECT_DELAY);
        }
    };
}

function stopListening() {
    S.listening = false;
    S.speechActive = false;
    stopMic();
    if (S.listenWs) {
        S.listenWs.onclose = null;
        S.listenWs.close();
        S.listenWs = null;
    }
    $('listenMicBtn').classList.remove('recording');
    $('listenStatus').textContent = 'Press to start listening';
    $('listenStatus').className = 'listen-status';
    $('audioMeter').classList.remove('visible');
    $('audioMeterFill').style.width = '0%';
    removeTranscriptPlaceholder();
}

function formatTimestamp() {
    const d = new Date();
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ':' + String(d.getSeconds()).padStart(2, '0');
}

function showTranscriptPlaceholder() {
    removeTranscriptPlaceholder();
    const area = $('transcriptArea');
    const entry = document.createElement('div');
    entry.className = 'transcript-entry transcript-placeholder';
    entry.innerHTML = '<div class="transcript-text" style="color:var(--text-muted)">...</div>';
    entry.id = 'transcriptPlaceholder';
    area.appendChild(entry);
    area.scrollTop = area.scrollHeight;
}

function updateTranscriptPlaceholder(text, isPartial) {
    const ph = $('transcriptPlaceholder');
    if (ph) {
        ph.querySelector('.transcript-text').textContent = text;
        ph.classList.toggle('transcript-partial', !!isPartial);
        ph.classList.toggle('transcript-placeholder', !isPartial);
    }
}

function removeTranscriptPlaceholder() {
    const ph = $('transcriptPlaceholder');
    if (ph) ph.remove();
}

function updateAudioMeter(samples) {
    let sum = 0;
    for (let i = 0; i < samples.length; i++) sum += samples[i] * samples[i];
    const rms = Math.sqrt(sum / samples.length);
    const level = Math.min(100, rms * 500);
    $('audioMeterFill').style.width = level + '%';
}

function handleListenEvent(data) {
    const status = $('listenStatus');
    switch (data.type) {
        case 'listen_ready':
            setDiarizationAvailable(!!data.diarization_available);
            // If the user had diarization enabled in a previous session and
            // still has consent, re-send the config to resume.
            if (S.diarizationOn && S.diarizationAvailable) {
                sendDiarizationConfig(true);
            }
            break;
        case 'speech_start':
            S.speechActive = true;
            status.textContent = 'Speaking...';
            status.className = 'listen-status active';
            showTranscriptPlaceholder();
            break;
        case 'partial':
            status.textContent = 'Speaking...';
            status.className = 'listen-status active';
            updateTranscriptPlaceholder(data.text || '...', true);
            break;
        case 'transcribing':
            status.textContent = 'Transcribing...';
            status.className = 'listen-status transcribing';
            updateTranscriptPlaceholder('Transcribing...', false);
            break;
        case 'transcript':
            removeTranscriptPlaceholder();
            appendTranscript(
                data.text,
                data.duration_ms,
                data.processing_time_ms,
                data.speaker_id,
                data.speaker_name,
                data.speaker_color
            );
            if (S.listening) {
                status.textContent = 'Listening...';
                status.className = 'listen-status active';
            }
            break;
        case 'speech_end':
            S.speechActive = false;
            if (S.listening) {
                status.textContent = 'Listening...';
                status.className = 'listen-status active';
            }
            break;
        case 'speaker_list':
            S.speakers = {};
            (data.speakers || []).forEach(sp => { S.speakers[sp.id] = sp; });
            renderSpeakersSidebar();
            break;
        case 'speaker_update':
            if (data.speaker) {
                S.speakers[data.speaker.id] = data.speaker;
                renderSpeakersSidebar();
            }
            break;
        case 'error':
            showToast(data.message, 'error');
            break;
    }
}

function appendTranscript(text, durationMs, processingMs, speakerId, speakerName, speakerColor) {
    removeTranscriptPlaceholder();
    const area = $('transcriptArea');
    const entry = document.createElement('div');
    entry.className = 'transcript-entry';
    entry.style.position = 'relative';

    let badgeHtml = '';
    if (speakerId && speakerName) {
        // Keep the local speaker cache in sync in case this is the first
        // time we've seen this id (the server sends updates for new ones).
        if (!S.speakers[speakerId]) {
            S.speakers[speakerId] = {
                id: speakerId,
                name: speakerName,
                color: speakerColor || '#888'
            };
            renderSpeakersSidebar();
        }
        entry.dataset.speaker = speakerId;
        if (speakerColor) {
            entry.style.setProperty('--speaker-color', speakerColor);
        }
        badgeHtml =
            '<span class="speaker-badge">' +
                '<span class="speaker-swatch" style="background:' + escapeHtml(speakerColor || '#888') + '"></span>' +
                escapeHtml(speakerName) +
            '</span>';
    }

    entry.innerHTML =
        '<button class="transcript-copy-btn" aria-label="Copy" title="Copy text">&#x2398;</button>' +
        '<div class="transcript-text">' + badgeHtml + escapeHtml(text) + '</div>' +
        '<div class="transcript-meta">' + formatTimestamp() + ' \u00b7 ' + durationMs + 'ms audio, ' + processingMs + 'ms processing</div>';
    const copyBtn = entry.querySelector('.transcript-copy-btn');
    copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(text).then(() => {
            copyBtn.textContent = '\u2713';
            setTimeout(() => { copyBtn.innerHTML = '&#x2398;'; }, 1500);
        });
    });
    area.appendChild(entry);
    area.scrollTop = area.scrollHeight;
}

// ─── Diarization helpers ────────────────────────────────────
function setDiarizationAvailable(available) {
    S.diarizationAvailable = available;
    const toggle = $('diarizeToggle');
    const cbx = $('diarizeCheckbox');
    if (!toggle || !cbx) return;
    if (available) {
        toggle.classList.remove('disabled');
        toggle.title = 'Toggle speaker diarization';
        cbx.disabled = false;
    } else {
        toggle.classList.add('disabled');
        toggle.classList.remove('on');
        toggle.title = 'Speaker diarization not available on this server';
        cbx.disabled = true;
        cbx.checked = false;
        S.diarizationOn = false;
    }
}

function sendDiarizationConfig(enabled) {
    if (!S.listenWs || S.listenWs.readyState !== WebSocket.OPEN) return;
    try {
        S.listenWs.send(JSON.stringify({ type: 'config', diarization: !!enabled }));
    } catch (_e) {
        // best-effort; nothing we can do if the socket is already closing
    }
}

function requestDiarizationConsent(onConfirm) {
    if (S.diarizationConsented) { onConfirm(); return; }
    const ok = window.confirm(
        'Enable speaker identification?\n\n' +
        'Vox will store a voiceprint locally (never uploaded) to label each speaker. ' +
        'You can rename or forget speakers at any time. This is an opt-in biometric feature.'
    );
    if (ok) {
        S.diarizationConsented = true;
        try { localStorage.setItem(DIARIZATION_CONSENT_KEY, '1'); } catch (_e) {}
        onConfirm();
    } else {
        // User declined → leave the checkbox off.
        const cbx = $('diarizeCheckbox');
        const toggle = $('diarizeToggle');
        if (cbx) cbx.checked = false;
        if (toggle) toggle.classList.remove('on');
        S.diarizationOn = false;
    }
}

function renderSpeakersSidebar() {
    const list = $('speakersList');
    const body = $('listenBody');
    if (!list || !body) return;
    if (S.diarizationOn) body.classList.add('with-sidebar');
    else body.classList.remove('with-sidebar');
    const speakers = Object.values(S.speakers);
    if (speakers.length === 0) {
        list.innerHTML = '<div class="speakers-sidebar-empty">No speakers yet</div>';
        return;
    }
    list.innerHTML = '';
    speakers.forEach(sp => {
        const row = document.createElement('div');
        row.className = 'speaker-row';
        row.innerHTML =
            '<span class="speaker-swatch" style="background:' + escapeHtml(sp.color || '#888') + '"></span>' +
            '<span class="speaker-name">' + escapeHtml(sp.name) + '</span>' +
            '<button class="speaker-forget" title="Forget speaker" aria-label="Forget speaker">\u00d7</button>';
        row.querySelector('.speaker-name').addEventListener('click', () => {
            const newName = window.prompt('Rename speaker:', sp.name);
            if (newName && newName.trim() && newName.trim() !== sp.name) {
                if (S.listenWs && S.listenWs.readyState === WebSocket.OPEN) {
                    S.listenWs.send(JSON.stringify({
                        type: 'rename_speaker',
                        id: sp.id,
                        name: newName.trim()
                    }));
                }
            }
        });
        row.querySelector('.speaker-forget').addEventListener('click', (e) => {
            e.stopPropagation();
            if (window.confirm('Forget "' + sp.name + '"? Their voiceprint will be deleted.')) {
                if (S.listenWs && S.listenWs.readyState === WebSocket.OPEN) {
                    S.listenWs.send(JSON.stringify({ type: 'forget_speaker', id: sp.id }));
                } else {
                    showToast('Cannot forget speaker: not connected', 'error');
                }
            }
        });
        list.appendChild(row);
    });
}

// ─── 7. SPEAK TAB ───────────────────────────────────────────
async function loadVoices() {
    if (S.voicesLoaded) return;
    try {
        const res = await fetch('/v1/voices');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        S.voices = data.voices || [];
        S.voicesLoaded = true;
        populateVoiceSelect($('voiceSelect'));
        populateVoiceSelect($('chatVoice'));
    } catch (e) {
        showToast('Failed to load voices', 'warning');
    }
}

function populateVoiceSelect(select) {
    select.innerHTML = '';
    if (S.voices.length === 0) {
        select.innerHTML = '<option value="">No voices available</option>';
        return;
    }
    S.voices.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.id;
        opt.textContent = v.name + ' (' + v.gender + ', ' + v.accent + ')';
        select.appendChild(opt);
    });
}

async function synthesize() {
    const text = $('speakText').value.trim();
    if (!text) return;

    const voice = $('voiceSelect').value;
    const btn = $('synthesizeBtn');

    S.synthesizing = true;
    btn.disabled = true;
    btn.textContent = 'Synthesizing...';

    try {
        const res = await fetch('/v1/synthesize', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, voice: voice || undefined }),
        });

        if (res.status === 503) {
            showToast('TTS model not loaded on server', 'error');
            return;
        }
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const player = $('audioPlayer');
        player.innerHTML = '<audio controls autoplay src="' + url + '"></audio>';
    } catch (e) {
        showToast('Synthesis failed: ' + e.message, 'error');
    } finally {
        S.synthesizing = false;
        btn.disabled = false;
        btn.textContent = 'Synthesize';
    }
}

// ─── 7a. STREAMING TTS ──────────────────────────────────────
async function streamSpeak() {
    const text = $('speakText').value.trim();
    if (!text) return;

    const voice = $('voiceSelect').value;
    const btn = $('streamSpeakBtn');
    const progress = $('streamProgress');

    btn.disabled = true;
    btn.textContent = 'Streaming...';
    progress.textContent = 'Connecting...';
    $('audioPlayer').innerHTML = '';

    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(proto + '//' + location.host + '/v1/speak');
    ws.binaryType = 'arraybuffer';

    const audioChunks = [];
    let playbackCtx = null;
    let nextStartTime = 0;
    let chunksReceived = 0;

    ws.onopen = () => {
        const payload = { text };
        if (voice) payload.voice = voice;
        ws.send(JSON.stringify(payload));
        progress.textContent = 'Waiting for audio...';
    };

    ws.onmessage = async (e) => {
        if (e.data instanceof ArrayBuffer) {
            chunksReceived++;
            if (!playbackCtx) {
                playbackCtx = new AudioContext();
                nextStartTime = playbackCtx.currentTime;
            }
            try {
                const audioBuffer = await playbackCtx.decodeAudioData(e.data.slice(0));
                const source = playbackCtx.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(playbackCtx.destination);
                const startAt = Math.max(nextStartTime, playbackCtx.currentTime);
                source.start(startAt);
                nextStartTime = startAt + audioBuffer.duration;
            } catch (err) {
                console.warn('Failed to decode audio chunk', err);
            }
        } else {
            try {
                const data = JSON.parse(e.data);
                switch (data.type) {
                    case 'tts_start':
                        progress.textContent = 'Synthesizing...';
                        break;
                    case 'tts_progress':
                        progress.textContent = 'Chunk ' + data.chunk + ' (' + Math.round(data.progress * 100) + '%)';
                        break;
                    case 'tts_done':
                        progress.textContent = 'Done — ' + data.chunks + ' chunk(s) streamed';
                        break;
                    case 'error':
                        showToast(data.message, 'error');
                        progress.textContent = 'Error';
                        break;
                }
            } catch (_) {}
        }
    };

    ws.onerror = () => {
        showToast('Streaming TTS connection failed', 'error');
        progress.textContent = '';
    };

    ws.onclose = () => {
        btn.disabled = false;
        btn.textContent = 'Stream';
    };
}

// ─── 7b. OLLAMA MODELS ──────────────────────────────────────
async function loadOllamaModels() {

            opt.textContent = m.name + sizeMB;

// ─── 8. CHAT TAB ────────────────────────────────────────────
async function sendChat(text, retryMsgEl) {
    if (!text || S.chatBusy) return;
    S.chatBusy = true;

    const model = $('chatModel').value || 'llama3.2';
    const voice = $('chatVoice').value;

    // If retrying, remove the old retry button; otherwise append new user message
    let userMsgEl;
    if (retryMsgEl) {
        userMsgEl = retryMsgEl;
        const oldRetry = userMsgEl.querySelector('.chat-retry-btn');
        if (oldRetry) oldRetry.remove();
    } else {
        userMsgEl = appendChatMessage('user', text);
        $('chatInput').value = '';
    }

    $('chatThinking').textContent = 'Thinking...';
    $('chatSendBtn').disabled = true;

    function addRetryBtn(msgEl, originalText) {
        const btn = document.createElement('button');
        btn.className = 'chat-retry-btn';
        btn.textContent = 'Retry';
        btn.addEventListener('click', () => sendChat(originalText, msgEl));
        msgEl.appendChild(btn);
    }

    try {
        const res = await fetch('/v1/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, model }),
        });

        if (res.status === 503) {
            const body = await res.json().catch(() => ({}));
            const msg = (body.error || '').includes('Ollama')
                ? 'Ollama not running. Start with: ollama serve'
                : body.error || 'Chat service unavailable';
            showToast(msg, 'error');
            addRetryBtn(userMsgEl, text);
            return;
        }
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const data = await res.json();
        appendChatMessage('assistant', data.response);

        // Synthesize response audio
        if (voice && data.response) {
            try {
                const ttsRes = await fetch('/v1/synthesize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: data.response, voice }),
                });
                if (ttsRes.ok) {
                    const blob = await ttsRes.blob();
                    const url = URL.createObjectURL(blob);
                    const audio = new Audio(url);
                    audio.play().catch(() => {});
                }
            } catch (_) { /* TTS for chat is best-effort */ }
        }
    } catch (e) {
        showToast('Chat failed: ' + e.message, 'error');
        addRetryBtn(userMsgEl, text);
    } finally {
        S.chatBusy = false;
        $('chatThinking').textContent = '';
        $('chatSendBtn').disabled = false;
    }
}

function appendChatMessage(role, text) {
    const area = $('chatMessages');
    const msg = document.createElement('div');
    msg.className = 'chat-msg ' + role;
    const sender = role === 'user' ? '[You]' : '[Vox]';
    msg.innerHTML =
        '<div class="chat-msg-sender">' + sender + '</div>' +
        '<div class="chat-msg-text">' + escapeHtml(text) + '</div>';
    area.appendChild(msg);
    area.scrollTop = area.scrollHeight;
    return msg;
}

function toggleChatMic() {
    if (S.chatMicActive) stopChatMic();
    else startChatMic();
}

async function startChatMic() {
    const btn = $('chatMicBtn');
    const input = $('chatInput');
    const model = $('chatModel').value || 'llama3.2';
    const voice = $('chatVoice').value || null;

    // Per-turn streaming state
    let currentAssistantMsg = null;
    const audioQueue = [];
    let isPlaying = false;

    function b64ToBlob(b64, mime) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new Blob([bytes], { type: mime });
    }

    async function playNext() {
        if (isPlaying || audioQueue.length === 0) return;
        isPlaying = true;
        const blob = audioQueue.shift();
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        const cleanup = () => {
            URL.revokeObjectURL(url);
            isPlaying = false;
            playNext();
        };
        audio.onended = cleanup;
        audio.onerror = cleanup;
        try { await audio.play(); } catch (_) { cleanup(); }
    }

    S.chatWs = connectWs('/v1/converse', (data) => {
        switch (data.type) {
            case 'ready':
                input.placeholder = 'Listening... speak naturally';
                break;
            case 'speech_start':
                btn.classList.add('speaking');
                input.placeholder = 'Recording...';
                break;
            case 'speech_end':
                btn.classList.remove('speaking');
                input.placeholder = 'Transcribing...';
                $('chatThinking').textContent = 'Transcribing...';
                break;
            case 'transcript':
                if (data.text && data.text.trim()) {
                    appendChatMessage('user', data.text);
                }
                $('chatThinking').textContent = 'Thinking...';
                currentAssistantMsg = null;
                break;
            case 'thinking':
                $('chatThinking').textContent = 'Generating...';
                break;
            case 'sentence': {
                if (!currentAssistantMsg) {
                    currentAssistantMsg = appendChatMessage('assistant', '');
                    $('chatThinking').textContent = 'Speaking...';
                }
                const textDiv = currentAssistantMsg.querySelector('.chat-msg-text');
                if (textDiv) {
                    const prev = textDiv.textContent || '';
                    textDiv.textContent = prev + (prev ? ' ' : '') + data.text;
                    const msgs = $('chatMessages');
                    msgs.scrollTop = msgs.scrollHeight;
                }
                if (data.audio_b64) {
                    audioQueue.push(b64ToBlob(data.audio_b64, 'audio/wav'));
                    playNext();
                }
                break;
            }
            case 'done':
                $('chatThinking').textContent = '';
                currentAssistantMsg = null;
                input.placeholder = 'Listening... (speak again, or click mic to stop)';
                break;
            case 'error':
                showToast(data.message || 'Server error', 'error');
                $('chatThinking').textContent = '';
                break;
        }
    });

    S.chatWs.onopen = async () => {
        // Send config as first text message (within 250ms).
        try {
            S.chatWs.send(JSON.stringify({ model, voice }));
        } catch (_) { /* ignore */ }

        const ok = await startMic((chunk) => {
            if (S.chatWs && S.chatWs.readyState === WebSocket.OPEN) {
                S.chatWs.send(chunk.buffer);
            }
        });
        if (!ok) {
            S.chatWs.close();
            S.chatWs = null;
            return;
        }
        S.chatMicActive = true;
        btn.classList.add('recording');
        // Placeholder is managed by the 'ready' message handler — don't overwrite here.
        // The server's `ready` event arrives during `await startMic()` and sets
        // "Listening... speak naturally". Any write here races against that.
    };

    S.chatWs.onerror = () => {
        showToast('WebSocket connection failed', 'error');
        stopChatMic();
    };

    S.chatWs.onclose = () => {
        if (S.chatMicActive) stopChatMic();
    };
}

function stopChatMic() {
    S.chatMicActive = false;
    stopMic();
    if (S.chatWs) {
        S.chatWs.onclose = null;
        S.chatWs.close();
        S.chatWs = null;
    }
    const btn = $('chatMicBtn');
    btn.classList.remove('recording');
    btn.classList.remove('speaking');
    $('chatInput').placeholder = 'Type a message...';
    $('chatThinking').textContent = '';
}

// ─── 8b. LIVE TALK TAB ──────────────────────────────────────
// State machine: idle → listening → transcribing → thinking → speaking → listening
// Barge-in paths: (a) server VAD (speech_start during active turn),
//                 (b) client RMS gate while speaking, (c) Cancel button.
const LT = {
    ws: null,              // WebSocket
    active: false,         // mic enabled
    state: 'idle',         // idle|listening|transcribing|thinking|speaking|cancelled
    mode: 'vad',           // 'vad' | 'push_to_talk'
    pttHeld: false,        // PTT button currently pressed
    audioCtx: null,        // dedicated playback AudioContext (default sample rate, NOT the 16kHz mic ctx)
    currentSource: null,   // currently-playing AudioBufferSourceNode
    queue: [],             // [{ sentence_index, text, buffer }]
    pendingHeader: null,   // last 'audio_chunk' header awaiting binary frame
    sentencesInTurn: 0,    // count of sentences since the last turn_done
    currentAssistantEl: null,
    turnActive: false,     // have we started a turn that hasn't ended yet
    turnCancelled: false,  // set true when we sent cancel or got cancelled event
    bargeInEnabled: true,
    // Client-side RMS barge-in during 'speaking': trailing window RMS
    micRmsHistory: [],
    RMS_WINDOW: 6,         // 6 * 300ms chunks ≈ 1.8s
    RMS_THRESHOLD: 0.03,   // empirical: above this during 'speaking' => barge-in
};

function setLiveState(state) {
    LT.state = state;
    const badge = $('liveStateBadge');
    if (!badge) return;
    badge.textContent = state;
    badge.className = 'live-state-badge ' + state;
    const cancelBtn = $('liveCancelBtn');
    if (cancelBtn) {
        cancelBtn.disabled = !(state === 'thinking' || state === 'speaking');
    }
}

function appendLiveMsg(role, text) {
    const area = $('liveTalkMessages');
    if (!area) return null;
    const msg = document.createElement('div');
    msg.className = 'live-msg ' + role;
    const sender = role === 'user' ? '[You]' : '[Vox]';
    msg.innerHTML =
        '<div class="live-msg-sender">' + sender + '</div>' +
        '<div class="live-msg-text">' + escapeHtml(text) + '</div>';
    area.appendChild(msg);
    area.scrollTop = area.scrollHeight;
    return msg;
}

function appendLiveSentence(text) {
    if (!LT.currentAssistantEl) {
        LT.currentAssistantEl = appendLiveMsg('assistant', '');
    }
    if (!LT.currentAssistantEl) return;
    const t = LT.currentAssistantEl.querySelector('.live-msg-text');
    if (t) {
        const prev = t.textContent || '';
        t.textContent = prev + (prev ? ' ' : '') + text;
        const area = $('liveTalkMessages');
        if (area) area.scrollTop = area.scrollHeight;
    }
}

function markLastAssistantCancelled() {
    if (LT.currentAssistantEl) {
        LT.currentAssistantEl.classList.add('cancelled');
    }
}

function updateLiveMeter(chunk) {
    // Visual meter only; RMS-for-barge-in is handled separately via fastRms()
    let sum = 0;
    for (let i = 0; i < chunk.length; i++) sum += chunk[i] * chunk[i];
    const rms = Math.sqrt(sum / chunk.length);
    const level = Math.min(100, rms * 500);
    const el = $('liveMeterFill');
    if (el) el.style.width = level + '%';
}

function fastRms(chunk) {
    // Subsampled RMS: every 8th sample ≈ 600 samples / 4800 chunk → ~10x faster
    let sum = 0;
    let n = 0;
    for (let i = 0; i < chunk.length; i += 8) {
        const s = chunk[i];
        sum += s * s;
        n++;
    }
    return n > 0 ? Math.sqrt(sum / n) : 0;
}

function clientBargeInCheck(chunk) {
    // Only meaningful while we're actively speaking response audio.
    if (!LT.bargeInEnabled) return;
    if (LT.state !== 'speaking') {
        LT.micRmsHistory.length = 0;
        return;
    }
    const rms = fastRms(chunk);
    LT.micRmsHistory.push(rms);
    if (LT.micRmsHistory.length > LT.RMS_WINDOW) {
        LT.micRmsHistory.shift();
    }
    if (LT.micRmsHistory.length < 2) return;
    // Require at least two consecutive chunks above threshold to avoid
    // single-frame glitches (AGC pop, typing, keyboard click).
    const tail = LT.micRmsHistory.slice(-2);
    if (tail.every((v) => v > LT.RMS_THRESHOLD)) {
        LT.micRmsHistory.length = 0;
        sendLiveCancel('user_barge_in_client');
    }
}

function sendLiveCancel(_reason) {
    if (!LT.ws || LT.ws.readyState !== WebSocket.OPEN) return;
    if (LT.turnCancelled || !LT.turnActive) return;
    LT.turnCancelled = true;
    try {
        LT.ws.send(JSON.stringify({ type: 'cancel' }));
    } catch (_) { /* ignore */ }
    cancelLivePlayback();
    markLastAssistantCancelled();
    setLiveState('cancelled');
}

function cancelLivePlayback() {
    if (LT.currentSource) {
        try { LT.currentSource.onended = null; LT.currentSource.stop(0); } catch (_) {}
        LT.currentSource = null;
    }
    LT.queue.length = 0;
}

function playNextLive() {
    if (LT.currentSource) return; // already playing
    const next = LT.queue.shift();
    if (!next) {
        // Queue drained. If the server has already said turn_done and we
        // weren't cancelled, return to listening.
        if (!LT.turnActive && !LT.turnCancelled && LT.active) {
            setLiveState('listening');
        }
        return;
    }
    try {
        const src = LT.audioCtx.createBufferSource();
        src.buffer = next.buffer;
        src.connect(LT.audioCtx.destination);
        src.onended = () => {
            LT.currentSource = null;
            playNextLive();
        };
        LT.currentSource = src;
        setLiveState('speaking');
        src.start();
    } catch (e) {
        LT.currentSource = null;
        playNextLive();
    }
}

async function decodeAndEnqueue(arrayBuffer, headerInfo) {
    try {
        if (!LT.audioCtx) {
            // Use a dedicated playback AudioContext at the browser's default
            // sample rate (typically 44.1/48 kHz). The mic AudioContext
            // (S.audioCtx) is locked to 16 kHz for VAD/STT; reusing it for
            // playback forced decodeAudioData to resample TTS audio (22050 Hz
            // Piper WAV) to 16 kHz, causing decode failures and quality loss
            // — especially on the first chunk where the context might still
            // be suspended.
            LT.audioCtx = new AudioContext();
        }
        if (LT.audioCtx.state === 'suspended') {
            try { await LT.audioCtx.resume(); } catch (_) {}
        }
        // decodeAudioData requires a non-detached ArrayBuffer. We get ours
        // directly from WebSocket.onmessage, so copy defensively.
        const copy = arrayBuffer.slice(0);
        const buffer = await new Promise((resolve, reject) => {
            LT.audioCtx.decodeAudioData(copy, resolve, reject);
        });
        LT.queue.push({
            sentence_index: headerInfo ? headerInfo.sentence_index : -1,
            buffer,
        });
        playNextLive();
    } catch (e) {
        console.error('Live Talk: decodeAndEnqueue failed:', e,
            'header:', headerInfo, 'byteLength:', arrayBuffer && arrayBuffer.byteLength);
    }
}

function handleLiveEvent(data) {
    switch (data.type) {
        case 'ready':
            setLiveState('listening');
            break;
        case 'speech_start':
            // Server VAD detected speech. If we were speaking, this is
            // a barge-in: cancel the active turn immediately.
            if (LT.state === 'speaking' || LT.state === 'thinking') {
                sendLiveCancel('user_barge_in_server');
            } else {
                setLiveState('listening');
            }
            break;
        case 'transcript':
            if (data.text && data.text.trim()) {
                appendLiveMsg('user', data.text);
            }
            setLiveState('thinking');
            LT.currentAssistantEl = null;
            LT.turnActive = true;
            LT.turnCancelled = false;
            LT.sentencesInTurn = 0;
            break;
        case 'thinking':
            setLiveState('thinking');
            break;
        case 'sentence':
            // Text-only — audio arrives via a subsequent audio_chunk header
            // + binary frame pair.
            appendLiveSentence(data.text);
            LT.sentencesInTurn = data.index + 1;
            break;
        case 'audio_chunk':
            // Header — the NEXT binary frame is the WAV payload for this
            // sentence. We stash it so ws.onmessage can pair them.
            LT.pendingHeader = data;
            break;
        case 'turn_done':
            LT.turnActive = false;
            // If we're still playing queued audio, stay in speaking until
            // the queue drains; playNextLive() will transition back to
            // listening. If nothing queued and we weren't cancelled, go
            // straight to listening.
            if (!LT.currentSource && LT.queue.length === 0 && !LT.turnCancelled && LT.active) {
                setLiveState('listening');
            }
            break;
        case 'cancelled':
            LT.turnActive = false;
            LT.turnCancelled = true;
            cancelLivePlayback();
            markLastAssistantCancelled();
            setLiveState('cancelled');
            // Return to listening after a beat so the user can speak again.
            setTimeout(() => {
                if (LT.active && LT.state === 'cancelled') setLiveState('listening');
            }, 400);
            break;
        case 'error':
            if (data.fatal) {
                showToast(data.message || 'Live Talk error', 'error');
                stopLiveTalk();
            } else {
                showToast(data.message || 'Live Talk warning', 'warning');
            }
            break;
        case 'partial':
        case 'token':
            // P1 wire events — not yet emitted by server, ignore.
            break;
    }
}

async function startLiveTalk() {
    if (LT.active) return;
    const btn = $('liveTalkMicBtn');
    if (btn) btn.classList.add('recording');

    const model = ($('liveTalkModel') && $('liveTalkModel').value) || null;
    const voice = ($('liveTalkVoice') && $('liveTalkVoice').value) || null;
    const modeSel = $('liveMode');
    LT.mode = modeSel && modeSel.value === 'push_to_talk' ? 'push_to_talk' : 'vad';

    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(proto + '//' + location.host + '/v1/live-talk');
    ws.binaryType = 'arraybuffer';
    LT.ws = ws;

    ws.onmessage = (e) => {
        if (typeof e.data === 'string') {
            let data;
            try { data = JSON.parse(e.data); } catch (_) { return; }
            handleLiveEvent(data);
        } else {
            // Binary: must be paired with the most recent audio_chunk header.
            const header = LT.pendingHeader;
            LT.pendingHeader = null;
            decodeAndEnqueue(e.data, header);
        }
    };

    ws.onopen = async () => {
        try {
            const cfg = { type: 'config' };
            if (model) cfg.model = model;
            if (voice) cfg.voice = voice;
            cfg.mode = LT.mode;
            ws.send(JSON.stringify(cfg));
        } catch (_) { /* ignore */ }

        const ok = await startMic((chunk) => {
            // Always send audio: the server only runs VAD / PTT segmentation
            // on its end. This includes during 'speaking' so server-side
            // VAD can detect user barge-in.
            if (LT.ws && LT.ws.readyState === WebSocket.OPEN) {
                try { LT.ws.send(chunk.buffer); } catch (_) {}
            }
            updateLiveMeter(chunk);
            clientBargeInCheck(chunk);
        });
        if (!ok) {
            try { ws.close(); } catch (_) {}
            LT.ws = null;
            if (btn) btn.classList.remove('recording');
            return;
        }
        LT.active = true;
        // Pre-initialize a dedicated playback AudioContext so the first
        // TTS chunk doesn't pay resume() latency. Using the browser's
        // default sample rate (44.1/48 kHz) avoids the 22050->16000
        // resampling that caused first-chunk decode failures.
        if (!LT.audioCtx) {
            LT.audioCtx = new AudioContext();
        }
        // Reveal / hide the PTT button based on mode.
        const pttBtn = $('livePttBtn');
        if (pttBtn) pttBtn.style.display = LT.mode === 'push_to_talk' ? '' : 'none';
    };

    ws.onerror = () => {
        showToast('Live Talk connection failed', 'error');
    };

    ws.onclose = () => {
        if (LT.active) {
            stopLiveTalk();
        }
    };
}

function stopLiveTalk() {
    LT.active = false;
    LT.turnActive = false;
    LT.turnCancelled = false;
    LT.pendingHeader = null;
    LT.sentencesInTurn = 0;
    cancelLivePlayback();
    stopMic();
    if (LT.audioCtx) {
        try { LT.audioCtx.close(); } catch (_) {}
        LT.audioCtx = null;
    }
    if (LT.ws) {
        try { LT.ws.onclose = null; LT.ws.close(); } catch (_) {}
        LT.ws = null;
    }
    const btn = $('liveTalkMicBtn');
    if (btn) btn.classList.remove('recording');
    setLiveState('idle');
    const meter = $('liveMeterFill');
    if (meter) meter.style.width = '0%';
}

function toggleLiveTalk() {
    if (LT.active) stopLiveTalk();
    else startLiveTalk();
}

function sendLivePtt(kind) {
    if (!LT.ws || LT.ws.readyState !== WebSocket.OPEN) return;
    try {
        LT.ws.send(JSON.stringify({ type: kind === 'start' ? 'ptt_start' : 'ptt_end' }));
    } catch (_) {}
}

async function loadLiveTalkSelectors() {
    // Live Talk shares the same ollama + voice catalogues as the Chat tab.
    // The /v1/ollama/models and /v1/voices endpoints are already used by
    // loadOllamaModels() / loadVoices(); we just mirror their results.
    if (!S.voicesLoaded) await loadVoices();
    if (!S.ollamaModelsLoaded) await loadOllamaModels();
    // After the chat selectors have populated, copy their current option
    // sets over so Live Talk offers the same choices. Using innerHTML of
    // the source selects is safe here — they were built from server data
    // that's already been escaped.
    const chatModel = $('chatModel');
    const liveModel = $('liveTalkModel');
    if (chatModel && liveModel) liveModel.innerHTML = chatModel.innerHTML;
    const chatVoice = $('chatVoice');
    const liveVoice = $('liveTalkVoice');
    if (chatVoice && liveVoice) liveVoice.innerHTML = chatVoice.innerHTML;
}

// ─── 9. DASHBOARD ───────────────────────────────────────────
function startDashPolling() {
    refreshDashboard();
    if (S.dashPollId) return;
    S.dashPollId = setInterval(refreshDashboard, DASH_POLL_INTERVAL);
}

function stopDashPolling() {
    if (S.dashPollId) {
        clearInterval(S.dashPollId);
        S.dashPollId = null;
    }
}

async function refreshDashboard() {
    const [healthRes, modelsRes, statsRes] = await Promise.allSettled([
        fetch('/health'),
        fetch('/v1/models'),
        fetch('/v1/stats'),
    ]);

    // Health
    if (healthRes.status === 'fulfilled' && healthRes.value.ok) {
        const data = await healthRes.value.json();
        const ok = data.status === 'ok';
        $('dashHealth').textContent = data.status;
        $('dashHealth').className = 'dash-card-value ' + (ok ? 'ok' : 'err');
        $('healthDot').className = 'health-dot ' + (ok ? 'ok' : 'err');
        $('healthText').textContent = 'health: ' + data.status;
    } else {
        $('dashHealth').textContent = 'error';
        $('dashHealth').className = 'dash-card-value err';
        $('healthDot').className = 'health-dot err';
        $('healthText').textContent = 'health: error';
    }

    // Models
    if (modelsRes.status === 'fulfilled' && modelsRes.value.ok) {
        const data = await modelsRes.value.json();
        let html = '';
        const renderBackend = (label, info) => {
            if (info) {
                const cls = info.loaded ? 'loaded' : 'not-loaded';
                const detail = info.model ? info.model : info.name;
                const size = info.size_mb ? ' (' + info.size_mb + 'MB)' : '';
                html += '<div class="dash-row"><span class="label">' + label + '</span><span><span class="dash-indicator ' + cls + '"></span>' + escapeHtml(detail) + size + '</span></div>';
            } else {
                html += '<div class="dash-row"><span class="label">' + label + '</span><span><span class="dash-indicator not-loaded"></span>not loaded</span></div>';
            }
        };
        renderBackend('stt', data.stt);
        renderBackend('streaming', data.streaming_stt);
        renderBackend('tts', data.tts);


        if (data.ollama) {
            const cls = data.ollama.connected ? 'loaded' : 'not-loaded';
            const status = data.ollama.connected ? data.ollama.model_count + ' models' : 'offline';
            html += '<div class="dash-row"><span class="label">ollama</span><span><span class="dash-indicator ' + cls + '"></span>' + status + '</span></div>';
        }

        $('dashModels').innerHTML = html;
        updateStatusBar(data, null);
    }

    // Stats
    if (statsRes.status === 'fulfilled' && statsRes.value.ok) {
        const data = await statsRes.value.json();
        $('dashStats').innerHTML =
            '<div class="dash-row"><span class="label">requests</span><span>' + data.requests + '</span></div>' +
            '<div class="dash-row"><span class="label">transcriptions</span><span>' + data.transcriptions + '</span></div>' +
            '<div class="dash-row"><span class="label">syntheses</span><span>' + data.syntheses + '</span></div>';
        $('dashUptime').textContent = formatUptime(data.uptime_secs);
        $('dashUptime').className = 'dash-card-value';
        updateStatusBar(null, data);
    }
}

function formatUptime(secs) {
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = secs % 60;
    return String(h).padStart(1, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

// ─── 10. STATUS BAR ─────────────────────────────────────────
function updateStatusBar(modelsData, statsData) {
    if (modelsData) {
        const sttLabel = modelsData.stt ? (modelsData.stt.model || modelsData.stt.name) : 'none';
        $('statusStt').textContent = 'stt: ' + sttLabel;
        const ttsLabel = modelsData.tts ? (modelsData.tts.model || modelsData.tts.name) : 'none';
        $('statusTts').textContent = 'tts: ' + ttsLabel;
        const hasStreaming = !!modelsData.streaming_stt;
        $('statusStreaming').textContent = 'streaming: ' + (hasStreaming ? 'on' : 'off');
        $('statusStreaming').style.color = hasStreaming ? 'var(--accent)' : '';
        if (modelsData.ollama) {
            const ollamaLabel = modelsData.ollama.connected
                ? modelsData.ollama.model_count + ' models'
                : 'offline';
            $('statusOllama').textContent = 'ollama: ' + ollamaLabel;
        }
    }
    if (statsData) {
        S.uptimeBase = statsData.uptime_secs;
        S.uptimeReceivedAt = Date.now();
        $('statusUptime').textContent = 'uptime: ' + formatUptime(statsData.uptime_secs);
    }
}

// ─── 11. STATUS BAR POLLING ──────────────────────────────────
async function refreshStatusBar() {
    try {
        const [modelsRes, statsRes] = await Promise.allSettled([
            fetch('/v1/models'),
            fetch('/v1/stats'),
        ]);
        if (modelsRes.status === 'fulfilled' && modelsRes.value.ok)
            updateStatusBar(await modelsRes.value.json(), null);
        if (statsRes.status === 'fulfilled' && statsRes.value.ok)
            updateStatusBar(null, await statsRes.value.json());
    } catch (_) {}
}

function tickUptime() {
    if (!S.uptimeReceivedAt) return;
    const elapsed = Math.floor((Date.now() - S.uptimeReceivedAt) / 1000);
    $('statusUptime').textContent = 'uptime: ' + formatUptime(S.uptimeBase + elapsed);
    if (S.activeTab === 'dashboard') {
        $('dashUptime').textContent = formatUptime(S.uptimeBase + elapsed);
    }
}

// ─── 12. INIT ───────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
    initTabs();

    // Listen tab
    $('listenMicBtn').addEventListener('click', toggleListening);
    $('clearTranscript').addEventListener('click', () => {
        $('transcriptArea').innerHTML = '';
    });
    $('diarizeCheckbox').addEventListener('change', (e) => {
        const cbx = e.target;
        const toggle = $('diarizeToggle');
        if (!S.diarizationAvailable) {
            cbx.checked = false;
            showToast('Speaker diarization is not available on this server', 'warning');
            return;
        }
        if (cbx.checked) {
            requestDiarizationConsent(() => {
                S.diarizationOn = true;
                toggle.classList.add('on');
                sendDiarizationConfig(true);
                renderSpeakersSidebar();
            });
        } else {
            S.diarizationOn = false;
            toggle.classList.remove('on');
            sendDiarizationConfig(false);
            renderSpeakersSidebar();
        }
    });

    // Speak tab
    $('synthesizeBtn').addEventListener('click', synthesize);
    $('streamSpeakBtn').addEventListener('click', streamSpeak);

    // Chat tab
    $('chatSendBtn').addEventListener('click', () => sendChat($('chatInput').value.trim()));
    $('chatInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendChat($('chatInput').value.trim());
        }
    });
    $('chatMicBtn').addEventListener('click', toggleChatMic);

    // Live Talk tab
    const liveMicBtn = $('liveTalkMicBtn');
    if (liveMicBtn) liveMicBtn.addEventListener('click', toggleLiveTalk);
    const liveCancelBtn = $('liveCancelBtn');
    if (liveCancelBtn) liveCancelBtn.addEventListener('click', () => sendLiveCancel('client_request'));
    const liveClearBtn = $('liveClearBtn');
    if (liveClearBtn) liveClearBtn.addEventListener('click', () => {
        const area = $('liveTalkMessages');
        if (area) area.innerHTML = '';
    });
    const liveModeSel = $('liveMode');
    if (liveModeSel) liveModeSel.addEventListener('change', (e) => {
        LT.mode = e.target.value === 'push_to_talk' ? 'push_to_talk' : 'vad';
        const pttBtn = $('livePttBtn');
        if (pttBtn) pttBtn.style.display = LT.mode === 'push_to_talk' ? '' : 'none';
        // If already connected, send a config update (server may choose to
        // honor or ignore mid-session mode swap).
        if (LT.ws && LT.ws.readyState === WebSocket.OPEN) {
            try { LT.ws.send(JSON.stringify({ type: 'config', mode: LT.mode })); } catch (_) {}
        }
    });
    const livePttBtn = $('livePttBtn');
    if (livePttBtn) {
        const pttStart = (ev) => {
            if (ev) ev.preventDefault();
            if (!LT.active || LT.pttHeld) return;
            LT.pttHeld = true;
            livePttBtn.classList.add('active');
            sendLivePtt('start');
        };
        const pttEnd = (ev) => {
            if (ev) ev.preventDefault();
            if (!LT.pttHeld) return;
            LT.pttHeld = false;
            livePttBtn.classList.remove('active');
            sendLivePtt('end');
        };
        livePttBtn.addEventListener('mousedown', pttStart);
        livePttBtn.addEventListener('mouseup', pttEnd);
        livePttBtn.addEventListener('mouseleave', pttEnd);
        livePttBtn.addEventListener('touchstart', pttStart, { passive: false });
        livePttBtn.addEventListener('touchend', pttEnd, { passive: false });
    }

    // Keyboard shortcut: Space toggles mic in Listen tab
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && S.activeTab === 'listen') {
            const tag = document.activeElement.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
            e.preventDefault();
            toggleListening();
        }
    });

    // Initial data load
    refreshDashboard();
    loadOllamaModels();

    // Status bar: poll server every 30s, tick uptime every 1s
    refreshStatusBar();
    S.statusPollId = setInterval(refreshStatusBar, STATUS_POLL_INTERVAL);
    S.uptimeTickId = setInterval(tickUptime, 1000);
});
</script>
</body>
</html>
