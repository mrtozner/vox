<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vox</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --bg-primary: #0a0a0a;
    --bg-secondary: #141414;
    --bg-tertiary: #1e1e1e;
    --accent: #4ade80;
    --accent-dim: #166534;
    --error: #ef4444;
    --warning: #f59e0b;
    --text-primary: #e0e0e0;
    --text-muted: #555;
    --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
    --radius: 8px;
}

body {
    font-family: var(--font-mono);
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
}

/* ── Header ───────────────────────────────────────────────── */
.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid var(--bg-tertiary);
    flex-shrink: 0;
}
.header-brand { font-size: 18px; font-weight: 700; letter-spacing: 2px; }
.header-brand span { color: var(--text-muted); font-weight: 400; font-size: 12px; margin-left: 8px; }
.header-health { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
.health-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-muted);
    transition: background 0.3s;
}
.health-dot.ok { background: var(--accent); }
.health-dot.err { background: var(--error); }

/* ── Tab Bar ──────────────────────────────────────────────── */
.tab-bar {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--bg-tertiary);
    flex-shrink: 0;
    overflow-x: auto;
}
.tab-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 10px 20px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.2s, border-color 0.2s;
    white-space: nowrap;
}
.tab-btn:hover { color: var(--text-primary); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ── Tab Content ──────────────────────────────────────────── */
.tab-content { flex: 1; overflow: hidden; display: none; flex-direction: column; }
.tab-content.active { display: flex; }

/* ── Listen Tab ───────────────────────────────────────────── */
.listen-controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 16px;
    gap: 12px;
    flex-shrink: 0;
}
.mic-btn {
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 2px solid var(--accent-dim);
    background: var(--bg-secondary);
    color: var(--accent-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s, color 0.2s, box-shadow 0.2s;
    position: relative;
}
.mic-btn:hover { border-color: var(--accent); color: var(--accent); }
.mic-btn.recording {
    border-color: var(--accent);
    color: var(--accent);
    animation: mic-pulse 1.5s ease-in-out infinite;
}
@keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.3); }
    50% { box-shadow: 0 0 0 12px rgba(74, 222, 128, 0); }
}
.mic-btn svg { width: 28px; height: 28px; fill: currentColor; }
.listen-status { font-size: 12px; color: var(--text-muted); min-height: 18px; }
.listen-status.active { color: var(--accent); }
.listen-status.transcribing { color: var(--warning); animation: transcribe-pulse 1s ease-in-out infinite; }
@keyframes transcribe-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

.audio-meter {
    width: 120px;
    height: 4px;
    background: var(--bg-tertiary);
    border-radius: 2px;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.3s;
}
.audio-meter.visible { opacity: 1; }
.audio-meter-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.1s;
}

.transcript-area {
    flex: 1;
    overflow-y: auto;
    padding: 0 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.transcript-entry {
    background: var(--bg-secondary);
    border: 1px solid var(--bg-tertiary);
    border-radius: var(--radius);
    padding: 10px 14px;
}
.transcript-text { font-size: 14px; word-break: break-word; }
.transcript-meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.transcript-placeholder .transcript-text { animation: dot-pulse 1.5s ease-in-out infinite; }
@keyframes dot-pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
.transcript-copy-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: none;
    border: 1px solid var(--bg-tertiary);
    border-radius: 4px;
    color: var(--text-muted);
    font-size: 12px;
    padding: 2px 6px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s, color 0.2s, border-color 0.2s;
    font-family: var(--font-mono);
    line-height: 1;
}
.transcript-entry:hover .transcript-copy-btn { opacity: 1; }
.transcript-copy-btn:hover { color: var(--accent); border-color: var(--accent); }
.transcript-clear {
    align-self: flex-end;
    margin-right: 20px;
    margin-bottom: 8px;
}

/* ── Speak Tab ────────────────────────────────────────────── */
.speak-container {
    display: flex;
    flex-direction: column;
    padding: 20px;
    gap: 16px;
    flex: 1;
}
.speak-container textarea {
    flex: 1;
    min-height: 120px;
    resize: vertical;
    background: var(--bg-secondary);
    border: 1px solid var(--bg-tertiary);
    border-radius: var(--radius);
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 14px;
    padding: 12px;
    outline: none;
    transition: border-color 0.2s;
}
.speak-container textarea:focus { border-color: var(--accent-dim); }
.speak-container textarea::placeholder { color: var(--text-muted); }
.speak-row {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
}
.speak-row select {
    flex: 1;
    min-width: 140px;
    background: var(--bg-secondary);
    border: 1px solid var(--bg-tertiary);
    border-radius: var(--radius);
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 8px 12px;
    outline: none;
    cursor: pointer;
}
.speak-row select:focus { border-color: var(--accent-dim); }
.audio-player { margin-top: 8px; }
.audio-player audio { width: 100%; outline: none; }

/* ── Chat Tab ─────────────────────────────────────────────── */
.chat-container { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
.chat-settings {
    display: flex;
    gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--bg-tertiary);
    flex-wrap: wrap;
    flex-shrink: 0;
}
.chat-settings label { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
.chat-settings input, .chat-settings select {
    background: var(--bg-secondary);
    border: 1px solid var(--bg-tertiary);
    border-radius: var(--radius);
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 6px 10px;
    outline: none;
}
.chat-settings input:focus, .chat-settings select:focus { border-color: var(--accent-dim); }
.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.chat-msg { max-width: 80%; display: flex; flex-direction: column; gap: 2px; }
.chat-msg.user { align-self: flex-end; }
.chat-msg.assistant { align-self: flex-start; }
.chat-msg-sender { font-size: 11px; color: var(--text-muted); }
.chat-msg-text {
    background: var(--bg-secondary);
    border: 1px solid var(--bg-tertiary);
    border-radius: var(--radius);
    padding: 10px 14px;
    font-size: 14px;
    word-break: break-word;
    white-space: pre-wrap;
}
.chat-msg.user .chat-msg-text { background: var(--accent-dim); border-color: var(--accent-dim); }
.chat-retry-btn {
    background: none;
    border: 1px solid var(--error);
    border-radius: var(--radius);
    color: var(--error);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 3px 10px;
    cursor: pointer;
    margin-top: 4px;
    transition: background 0.2s, color 0.2s;
    align-self: flex-end;
}
.chat-retry-btn:hover { background: var(--error); color: #fff; }
.chat-thinking { font-size: 12px; color: var(--text-muted); padding: 0 20px; flex-shrink: 0; min-height: 20px; }
.chat-input-bar {
    display: flex;
    gap: 8px;
    padding: 12px 20px;
    border-top: 1px solid var(--bg-tertiary);
    flex-shrink: 0;
}
.chat-input-bar input {
    flex: 1;
    background: var(--bg-secondary);
    border: 1px solid var(--bg-tertiary);
    border-radius: var(--radius);
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
}
.chat-input-bar input:focus { border-color: var(--accent-dim); }
.chat-input-bar input::placeholder { color: var(--text-muted); }
.chat-mic-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid var(--bg-tertiary);
    background: var(--bg-secondary);
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s, color 0.2s;
    flex-shrink: 0;
}
.chat-mic-btn:hover { border-color: var(--accent-dim); color: var(--accent); }
.chat-mic-btn.recording { border-color: var(--accent); color: var(--accent); animation: mic-pulse 1.5s ease-in-out infinite; }
.chat-mic-btn svg { width: 18px; height: 18px; fill: currentColor; }

/* ── Dashboard Tab ────────────────────────────────────────── */
.dashboard {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    padding: 20px;
    align-content: start;
    overflow-y: auto;
    flex: 1;
}
.dash-card {
    background: var(--bg-secondary);
    border: 1px solid var(--bg-tertiary);
    border-radius: var(--radius);
    padding: 20px;
}
.dash-card-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
.dash-card-value { font-size: 22px; font-weight: 700; }
.dash-card-value.ok { color: var(--accent); }
.dash-card-value.err { color: var(--error); }
.dash-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 13px; }
.dash-row .label { color: var(--text-muted); }
.dash-indicator {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
}
.dash-indicator.loaded { background: var(--accent); }
.dash-indicator.not-loaded { background: var(--text-muted); }

/* ── Status Bar ───────────────────────────────────────────── */
.status-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 8px 20px;
    border-top: 1px solid var(--bg-tertiary);
    font-size: 11px;
    color: var(--text-muted);
    flex-shrink: 0;
    flex-wrap: wrap;
}

/* ── Buttons ──────────────────────────────────────────────── */
.btn {
    background: var(--accent-dim);
    color: var(--accent);
    border: 1px solid var(--accent-dim);
    border-radius: var(--radius);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 8px 20px;
    cursor: pointer;
    transition: background 0.2s, opacity 0.2s;
    white-space: nowrap;
}
.btn:hover { background: #1a7a3a; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-sm { padding: 4px 12px; font-size: 12px; }
.btn-ghost {
    background: transparent;
    border: 1px solid var(--bg-tertiary);
    color: var(--text-muted);
}
.btn-ghost:hover { border-color: var(--text-muted); color: var(--text-primary); }

/* ── Toasts ───────────────────────────────────────────────── */
.toast-container {
    position: fixed;
    top: 12px;
    right: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 1000;
    pointer-events: none;
}
.toast {
    background: var(--bg-tertiary);
    border: 1px solid var(--text-muted);
    border-radius: var(--radius);
    padding: 10px 36px 10px 14px;
    font-size: 13px;
    color: var(--text-primary);
    pointer-events: auto;
    animation: toast-in 0.25s ease-out;
    position: relative;
    max-width: 360px;
    word-break: break-word;
}
.toast.error { border-color: var(--error); }
.toast.warning { border-color: var(--warning); }
.toast-close {
    position: absolute;
    top: 8px;
    right: 10px;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    font-family: var(--font-mono);
}
.toast-close:hover { color: var(--text-primary); }
@keyframes toast-in { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
.toast.dismissing { animation: toast-out 0.2s ease-in forwards; }
@keyframes toast-out { to { opacity: 0; transform: translateX(20px); } }

/* ── Scrollbar ────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ── Responsive ───────────────────────────────────────────── */
@media (max-width: 600px) {
    .header { padding: 10px 14px; }
    .tab-btn { padding: 8px 14px; font-size: 12px; }
    .speak-container, .chat-messages, .dashboard { padding: 14px; }
    .chat-input-bar, .chat-settings { padding: 10px 14px; }
    .chat-msg { max-width: 90%; }
    .dashboard { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
    .mic-btn.recording, .chat-mic-btn.recording { animation: none; }
    .toast { animation: none; }
    .toast.dismissing { animation: none; opacity: 0; }
    .listen-status.transcribing { animation: none; }
    .transcript-placeholder .transcript-text { animation: none; }
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
    <div class="header-brand">vox<span>v0.2.0</span></div>
    <div class="header-health">
        <div class="health-dot" id="healthDot"></div>
        <span id="healthText">--</span>
    </div>
</div>

<!-- Tab Bar -->
<div class="tab-bar">
    <button class="tab-btn active" data-tab="listen">Listen</button>
    <button class="tab-btn" data-tab="speak">Speak</button>
    <button class="tab-btn" data-tab="chat">Chat</button>
    <button class="tab-btn" data-tab="dashboard">Dashboard</button>
</div>

<!-- Listen Tab -->
<div class="tab-content active" id="tab-listen">
    <div class="listen-controls">
        <button class="mic-btn" id="listenMicBtn" aria-label="Toggle microphone">
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </button>
        <div class="listen-status" id="listenStatus">Press to start listening</div>
        <div class="audio-meter" id="audioMeter"><div class="audio-meter-fill" id="audioMeterFill"></div></div>
    </div>
    <button class="btn btn-sm btn-ghost transcript-clear" id="clearTranscript">Clear</button>
    <div class="transcript-area" id="transcriptArea"></div>
</div>

<!-- Speak Tab -->
<div class="tab-content" id="tab-speak">
    <div class="speak-container">
        <textarea id="speakText" placeholder="Enter text to synthesize..." rows="6"></textarea>
        <div class="speak-row">
            <select id="voiceSelect"><option value="">Loading voices...</option></select>
            <button class="btn" id="synthesizeBtn">Synthesize</button>
        </div>
        <div class="audio-player" id="audioPlayer"></div>
    </div>
</div>

<!-- Chat Tab -->
<div class="tab-content" id="tab-chat">
    <div class="chat-container">
        <div class="chat-settings">
            <label>model <select id="chatModel"><option value="">loading...</option></select></label>
            <label>voice <select id="chatVoice"><option value="">--</option></select></label>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-thinking" id="chatThinking"></div>
        <div class="chat-input-bar">
            <input type="text" id="chatInput" placeholder="Type a message..." autocomplete="off">
            <button class="btn" id="chatSendBtn">Send</button>
            <button class="chat-mic-btn" id="chatMicBtn" aria-label="Voice input">
                <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            </button>
        </div>
    </div>
</div>

<!-- Dashboard Tab -->
<div class="tab-content" id="tab-dashboard">
    <div class="dashboard">
        <div class="dash-card">
            <div class="dash-card-title">Health</div>
            <div class="dash-card-value" id="dashHealth">--</div>
        </div>
        <div class="dash-card">
            <div class="dash-card-title">Models</div>
            <div id="dashModels"><span style="color:var(--text-muted)">loading...</span></div>
        </div>
        <div class="dash-card">
            <div class="dash-card-title">Statistics</div>
            <div id="dashStats"><span style="color:var(--text-muted)">loading...</span></div>
        </div>
        <div class="dash-card">
            <div class="dash-card-title">Uptime</div>
            <div class="dash-card-value" id="dashUptime">--</div>
        </div>
    </div>
</div>

<!-- Status Bar -->
<div class="status-bar">
    <span id="statusStt">stt: --</span>
    <span id="statusTts">tts: --</span>
    <span id="statusUptime">uptime: --</span>
</div>

<!-- Toasts -->
<div class="toast-container" id="toastContainer"></div>

<script>
// ─── 1. STATE & CONFIG ──────────────────────────────────────
const S = {
    activeTab: 'listen',
    listening: false,
    chatMicActive: false,
    audioCtx: null,
    workletNode: null,
    mediaStream: null,
    listenWs: null,
    chatWs: null,
    voicesLoaded: false,
    ollamaModelsLoaded: false,
    voices: [],
    dashPollId: null,
    speechActive: false,
    reconnecting: false,
    synthesizing: false,
    chatBusy: false,
};

const MAX_TOASTS = 3;
const TOAST_DURATION = 5000;
const DASH_POLL_INTERVAL = 5000;
const WS_RECONNECT_DELAY = 2000;
const CHUNK_SIZE = 4800;

function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
}

function $(id) { return document.getElementById(id); }

// ─── 2. TAB SYSTEM ──────────────────────────────────────────
function initTabs() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });
}

function switchTab(name) {
    if (S.activeTab === name) return;
    S.activeTab = name;

    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-' + name));

    if (name === 'speak' && !S.voicesLoaded) loadVoices();
    if (name === 'chat') {
        if (!S.voicesLoaded) loadVoices();
        loadOllamaModels();
    }
    if (name === 'dashboard') startDashPolling();
    else stopDashPolling();
}

// ─── 3. TOAST SYSTEM ────────────────────────────────────────
function showToast(message, type) {
    const container = $('toastContainer');
    while (container.children.length >= MAX_TOASTS) {
        container.removeChild(container.firstChild);
    }

    const toast = document.createElement('div');
    toast.className = 'toast' + (type ? ' ' + type : '');
    toast.innerHTML = escapeHtml(message) + '<button class="toast-close" aria-label="Dismiss">&times;</button>';

    const closeBtn = toast.querySelector('.toast-close');
    const dismiss = () => {
        toast.classList.add('dismissing');
        setTimeout(() => toast.remove(), 200);
    };
    closeBtn.addEventListener('click', dismiss);
    setTimeout(dismiss, TOAST_DURATION);

    container.appendChild(toast);
}

// ─── 4. AUDIO WORKLET ───────────────────────────────────────
const processorCode = `
class VoxProcessor extends AudioWorkletProcessor {
    constructor() {
        super();
        this.buffer = new Float32Array(${CHUNK_SIZE});
        this.offset = 0;
    }
    process(inputs) {
        const input = inputs[0][0];
        if (!input) return true;
        for (let i = 0; i < input.length; i++) {
            this.buffer[this.offset++] = input[i];
            if (this.offset >= ${CHUNK_SIZE}) {
                this.port.postMessage(this.buffer.slice(0));
                this.offset = 0;
            }
        }
        return true;
    }
}
registerProcessor('vox-processor', VoxProcessor);
`;

let workletUrl = null;
function getWorkletUrl() {
    if (!workletUrl) {
        workletUrl = URL.createObjectURL(new Blob([processorCode], { type: 'application/javascript' }));
    }
    return workletUrl;
}

async function initAudio() {
    if (S.audioCtx) return;
    S.audioCtx = new AudioContext({ sampleRate: 16000 });
    await S.audioCtx.audioWorklet.addModule(getWorkletUrl());
}

async function startMic(onChunk) {
    if (!window.isSecureContext) {
        showToast('Microphone requires HTTPS or localhost', 'error');
        return false;
    }

    try {
        await initAudio();
        if (S.audioCtx.state === 'suspended') await S.audioCtx.resume();

        S.mediaStream = await navigator.mediaDevices.getUserMedia({
            audio: { channelCount: 1, sampleRate: 16000 }
        });
    } catch (e) {
        if (e.name === 'NotAllowedError') showToast('Microphone access denied', 'error');
        else if (e.name === 'NotFoundError') showToast('No microphone detected', 'error');
        else showToast('Microphone error: ' + e.message, 'error');
        return false;
    }

    const source = S.audioCtx.createMediaStreamSource(S.mediaStream);
    S.workletNode = new AudioWorkletNode(S.audioCtx, 'vox-processor');
    S.workletNode.port.onmessage = (e) => onChunk(e.data);
    source.connect(S.workletNode);
    S.workletNode.connect(S.audioCtx.destination);
    return true;
}

function stopMic() {
    if (S.workletNode) {
        S.workletNode.disconnect();
        S.workletNode = null;
    }
    if (S.mediaStream) {
        S.mediaStream.getTracks().forEach(t => t.stop());
        S.mediaStream = null;
    }
}

// ─── 5. WEBSOCKET ───────────────────────────────────────────
function connectWs(path, onMessage) {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(proto + '//' + location.host + path);
    ws.binaryType = 'arraybuffer';
    ws.onmessage = (e) => {
        try {
            const data = JSON.parse(e.data);
            onMessage(data);
        } catch (_) { /* ignore non-JSON */ }
    };
    return ws;
}

// ─── 6. LISTEN TAB ──────────────────────────────────────────
function toggleListening() {
    if (S.listening) stopListening();
    else startListening();
}

async function startListening() {
    const btn = $('listenMicBtn');
    const status = $('listenStatus');

    S.listenWs = connectWs('/v1/listen', handleListenEvent);

    S.listenWs.onopen = async () => {
        const ok = await startMic((chunk) => {
            if (S.listenWs && S.listenWs.readyState === WebSocket.OPEN) {
                S.listenWs.send(chunk.buffer);
            }
            updateAudioMeter(chunk);
        });
        if (!ok) {
            S.listenWs.close();
            S.listenWs = null;
            return;
        }
        S.listening = true;
        btn.classList.add('recording');
        status.textContent = 'Listening...';
        status.classList.add('active');
        $('audioMeter').classList.add('visible');
    };

    S.listenWs.onerror = () => {
        showToast('WebSocket connection failed', 'error');
    };

    S.listenWs.onclose = () => {
        if (S.listening && !S.reconnecting) {
            S.reconnecting = true;
            status.textContent = 'Reconnecting...';
            setTimeout(() => {
                S.reconnecting = false;
                if (S.listening) {
                    stopMic();
                    S.listening = false;
                    btn.classList.remove('recording');
                    startListening();
                }
            }, WS_RECONNECT_DELAY);
        }
    };
}

function stopListening() {
    S.listening = false;
    S.speechActive = false;
    stopMic();
    if (S.listenWs) {
        S.listenWs.onclose = null;
        S.listenWs.close();
        S.listenWs = null;
    }
    $('listenMicBtn').classList.remove('recording');
    $('listenStatus').textContent = 'Press to start listening';
    $('listenStatus').className = 'listen-status';
    $('audioMeter').classList.remove('visible');
    $('audioMeterFill').style.width = '0%';
    removeTranscriptPlaceholder();
}

function formatTimestamp() {
    const d = new Date();
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ':' + String(d.getSeconds()).padStart(2, '0');
}

function showTranscriptPlaceholder() {
    removeTranscriptPlaceholder();
    const area = $('transcriptArea');
    const entry = document.createElement('div');
    entry.className = 'transcript-entry transcript-placeholder';
    entry.innerHTML = '<div class="transcript-text" style="color:var(--text-muted)">...</div>';
    entry.id = 'transcriptPlaceholder';
    area.appendChild(entry);
    area.scrollTop = area.scrollHeight;
}

function updateTranscriptPlaceholder(text) {
    const ph = $('transcriptPlaceholder');
    if (ph) {
        ph.querySelector('.transcript-text').textContent = text;
    }
}

function removeTranscriptPlaceholder() {
    const ph = $('transcriptPlaceholder');
    if (ph) ph.remove();
}

function updateAudioMeter(samples) {
    let sum = 0;
    for (let i = 0; i < samples.length; i++) sum += samples[i] * samples[i];
    const rms = Math.sqrt(sum / samples.length);
    const level = Math.min(100, rms * 500);
    $('audioMeterFill').style.width = level + '%';
}

function handleListenEvent(data) {
    const status = $('listenStatus');
    switch (data.type) {
        case 'speech_start':
            S.speechActive = true;
            status.textContent = 'Speaking...';
            status.className = 'listen-status active';
            showTranscriptPlaceholder();
            break;
        case 'transcribing':
            status.textContent = 'Transcribing...';
            status.className = 'listen-status transcribing';
            updateTranscriptPlaceholder('Transcribing...');
            break;
        case 'transcript':
            removeTranscriptPlaceholder();
            appendTranscript(data.text, data.duration_ms, data.processing_time_ms);
            if (S.listening) {
                status.textContent = 'Listening...';
                status.className = 'listen-status active';
            }
            break;
        case 'speech_end':
            S.speechActive = false;
            if (S.listening) {
                status.textContent = 'Listening...';
                status.className = 'listen-status active';
            }
            break;
        case 'error':
            showToast(data.message, 'error');
            break;
    }
}

function appendTranscript(text, durationMs, processingMs) {
    removeTranscriptPlaceholder();
    const area = $('transcriptArea');
    const entry = document.createElement('div');
    entry.className = 'transcript-entry';
    entry.style.position = 'relative';
    entry.innerHTML =
        '<button class="transcript-copy-btn" aria-label="Copy" title="Copy text">&#x2398;</button>' +
        '<div class="transcript-text">' + escapeHtml(text) + '</div>' +
        '<div class="transcript-meta">' + formatTimestamp() + ' \u00b7 ' + durationMs + 'ms audio, ' + processingMs + 'ms processing</div>';
    const copyBtn = entry.querySelector('.transcript-copy-btn');
    copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(text).then(() => {
            copyBtn.textContent = '\u2713';
            setTimeout(() => { copyBtn.innerHTML = '&#x2398;'; }, 1500);
        });
    });
    area.appendChild(entry);
    area.scrollTop = area.scrollHeight;
}

// ─── 7. SPEAK TAB ───────────────────────────────────────────
async function loadVoices() {
    if (S.voicesLoaded) return;
    try {
        const res = await fetch('/v1/voices');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        S.voices = data.voices || [];
        S.voicesLoaded = true;
        populateVoiceSelect($('voiceSelect'));
        populateVoiceSelect($('chatVoice'));
    } catch (e) {
        showToast('Failed to load voices', 'warning');
    }
}

function populateVoiceSelect(select) {
    select.innerHTML = '';
    if (S.voices.length === 0) {
        select.innerHTML = '<option value="">No voices available</option>';
        return;
    }
    S.voices.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.id;
        opt.textContent = v.name + ' (' + v.gender + ', ' + v.accent + ')';
        select.appendChild(opt);
    });
}

async function synthesize() {
    const text = $('speakText').value.trim();
    if (!text) return;

    const voice = $('voiceSelect').value;
    const btn = $('synthesizeBtn');

    S.synthesizing = true;
    btn.disabled = true;
    btn.textContent = 'Synthesizing...';

    try {
        const res = await fetch('/v1/synthesize', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, voice: voice || undefined }),
        });

        if (res.status === 503) {
            showToast('TTS model not loaded on server', 'error');
            return;
        }
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const player = $('audioPlayer');
        player.innerHTML = '<audio controls autoplay src="' + url + '"></audio>';
    } catch (e) {
        showToast('Synthesis failed: ' + e.message, 'error');
    } finally {
        S.synthesizing = false;
        btn.disabled = false;
        btn.textContent = 'Synthesize';
    }
}

// ─── 7b. OLLAMA MODELS ──────────────────────────────────────
async function loadOllamaModels() {
    if (S.ollamaModelsLoaded) return;
    try {
        const res = await fetch('/v1/ollama-models');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const select = $('chatModel');
        select.innerHTML = '';
        if (!data.models || data.models.length === 0) {
            select.innerHTML = '<option value="llama3.2">llama3.2 (default)</option>';
            return;
        }
        data.models.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m.name;
            const sizeMB = m.size ? ' (' + (m.size / 1e9).toFixed(1) + 'GB)' : '';
            opt.textContent = m.name + sizeMB;
            select.appendChild(opt);
        });
        S.ollamaModelsLoaded = true;
    } catch (e) {
        const select = $('chatModel');
        select.innerHTML = '<option value="llama3.2">llama3.2 (default)</option>';
    }
}

// ─── 8. CHAT TAB ────────────────────────────────────────────
async function sendChat(text, retryMsgEl) {
    if (!text || S.chatBusy) return;
    S.chatBusy = true;

    const model = $('chatModel').value || 'llama3.2';
    const voice = $('chatVoice').value;

    // If retrying, remove the old retry button; otherwise append new user message
    let userMsgEl;
    if (retryMsgEl) {
        userMsgEl = retryMsgEl;
        const oldRetry = userMsgEl.querySelector('.chat-retry-btn');
        if (oldRetry) oldRetry.remove();
    } else {
        userMsgEl = appendChatMessage('user', text);
        $('chatInput').value = '';
    }

    $('chatThinking').textContent = 'Thinking...';
    $('chatSendBtn').disabled = true;

    function addRetryBtn(msgEl, originalText) {
        const btn = document.createElement('button');
        btn.className = 'chat-retry-btn';
        btn.textContent = 'Retry';
        btn.addEventListener('click', () => sendChat(originalText, msgEl));
        msgEl.appendChild(btn);
    }

    try {
        const res = await fetch('/v1/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, model }),
        });

        if (res.status === 503) {
            const body = await res.json().catch(() => ({}));
            const msg = (body.error || '').includes('Ollama')
                ? 'Ollama not running. Start with: ollama serve'
                : body.error || 'Chat service unavailable';
            showToast(msg, 'error');
            addRetryBtn(userMsgEl, text);
            return;
        }
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const data = await res.json();
        appendChatMessage('assistant', data.response);

        // Synthesize response audio
        if (voice && data.response) {
            try {
                const ttsRes = await fetch('/v1/synthesize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: data.response, voice }),
                });
                if (ttsRes.ok) {
                    const blob = await ttsRes.blob();
                    const url = URL.createObjectURL(blob);
                    const audio = new Audio(url);
                    audio.play().catch(() => {});
                }
            } catch (_) { /* TTS for chat is best-effort */ }
        }
    } catch (e) {
        showToast('Chat failed: ' + e.message, 'error');
        addRetryBtn(userMsgEl, text);
    } finally {
        S.chatBusy = false;
        $('chatThinking').textContent = '';
        $('chatSendBtn').disabled = false;
    }
}

function appendChatMessage(role, text) {
    const area = $('chatMessages');
    const msg = document.createElement('div');
    msg.className = 'chat-msg ' + role;
    const sender = role === 'user' ? '[You]' : '[Vox]';
    msg.innerHTML =
        '<div class="chat-msg-sender">' + sender + '</div>' +
        '<div class="chat-msg-text">' + escapeHtml(text) + '</div>';
    area.appendChild(msg);
    area.scrollTop = area.scrollHeight;
    return msg;
}

function toggleChatMic() {
    if (S.chatMicActive) stopChatMic();
    else startChatMic();
}

async function startChatMic() {
    const btn = $('chatMicBtn');
    const input = $('chatInput');

    S.chatWs = connectWs('/v1/listen', (data) => {
        if (data.type === 'transcript' && data.text) {
            stopChatMic();
            input.value = data.text;
            sendChat(data.text);
        } else if (data.type === 'error') {
            showToast(data.message, 'error');
            stopChatMic();
        }
    });

    S.chatWs.onopen = async () => {
        const ok = await startMic((chunk) => {
            if (S.chatWs && S.chatWs.readyState === WebSocket.OPEN) {
                S.chatWs.send(chunk.buffer);
            }
        });
        if (!ok) {
            S.chatWs.close();
            S.chatWs = null;
            return;
        }
        S.chatMicActive = true;
        btn.classList.add('recording');
        input.placeholder = 'Listening...';
    };

    S.chatWs.onerror = () => {
        showToast('WebSocket connection failed', 'error');
        stopChatMic();
    };

    S.chatWs.onclose = () => {
        if (S.chatMicActive) stopChatMic();
    };
}

function stopChatMic() {
    S.chatMicActive = false;
    stopMic();
    if (S.chatWs) {
        S.chatWs.onclose = null;
        S.chatWs.close();
        S.chatWs = null;
    }
    $('chatMicBtn').classList.remove('recording');
    $('chatInput').placeholder = 'Type a message...';
}

// ─── 9. DASHBOARD ───────────────────────────────────────────
function startDashPolling() {
    refreshDashboard();
    if (S.dashPollId) return;
    S.dashPollId = setInterval(refreshDashboard, DASH_POLL_INTERVAL);
}

function stopDashPolling() {
    if (S.dashPollId) {
        clearInterval(S.dashPollId);
        S.dashPollId = null;
    }
}

async function refreshDashboard() {
    const [healthRes, modelsRes, statsRes] = await Promise.allSettled([
        fetch('/health'),
        fetch('/v1/models'),
        fetch('/v1/stats'),
    ]);

    // Health
    if (healthRes.status === 'fulfilled' && healthRes.value.ok) {
        const data = await healthRes.value.json();
        const ok = data.status === 'ok';
        $('dashHealth').textContent = data.status;
        $('dashHealth').className = 'dash-card-value ' + (ok ? 'ok' : 'err');
        $('healthDot').className = 'health-dot ' + (ok ? 'ok' : 'err');
        $('healthText').textContent = 'health: ' + data.status;
    } else {
        $('dashHealth').textContent = 'error';
        $('dashHealth').className = 'dash-card-value err';
        $('healthDot').className = 'health-dot err';
        $('healthText').textContent = 'health: error';
    }

    // Models
    if (modelsRes.status === 'fulfilled' && modelsRes.value.ok) {
        const data = await modelsRes.value.json();
        let html = '';
        const renderBackend = (label, info) => {
            if (info) {
                const cls = info.loaded ? 'loaded' : 'not-loaded';
                html += '<div class="dash-row"><span class="label">' + label + '</span><span><span class="dash-indicator ' + cls + '"></span>' + escapeHtml(info.name) + '</span></div>';
            } else {
                html += '<div class="dash-row"><span class="label">' + label + '</span><span><span class="dash-indicator not-loaded"></span>not loaded</span></div>';
            }
        };
        renderBackend('stt', data.stt);
        renderBackend('tts', data.tts);
        $('dashModels').innerHTML = html;
        updateStatusBar(data, null);
    }

    // Stats
    if (statsRes.status === 'fulfilled' && statsRes.value.ok) {
        const data = await statsRes.value.json();
        $('dashStats').innerHTML =
            '<div class="dash-row"><span class="label">requests</span><span>' + data.requests + '</span></div>' +
            '<div class="dash-row"><span class="label">transcriptions</span><span>' + data.transcriptions + '</span></div>' +
            '<div class="dash-row"><span class="label">syntheses</span><span>' + data.syntheses + '</span></div>';
        $('dashUptime').textContent = formatUptime(data.uptime_secs);
        $('dashUptime').className = 'dash-card-value';
        updateStatusBar(null, data);
    }
}

function formatUptime(secs) {
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = secs % 60;
    return String(h).padStart(1, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

// ─── 10. STATUS BAR ─────────────────────────────────────────
function updateStatusBar(modelsData, statsData) {
    if (modelsData) {
        $('statusStt').textContent = 'stt: ' + (modelsData.stt ? modelsData.stt.name : 'none');
        $('statusTts').textContent = 'tts: ' + (modelsData.tts ? modelsData.tts.name : 'none');
    }
    if (statsData) {
        $('statusUptime').textContent = 'uptime: ' + formatUptime(statsData.uptime_secs);
    }
}

// ─── 11. INIT ───────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
    initTabs();

    // Listen tab
    $('listenMicBtn').addEventListener('click', toggleListening);
    $('clearTranscript').addEventListener('click', () => {
        $('transcriptArea').innerHTML = '';
    });

    // Speak tab
    $('synthesizeBtn').addEventListener('click', synthesize);

    // Chat tab
    $('chatSendBtn').addEventListener('click', () => sendChat($('chatInput').value.trim()));
    $('chatInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendChat($('chatInput').value.trim());
        }
    });
    $('chatMicBtn').addEventListener('click', toggleChatMic);

    // Keyboard shortcut: Space toggles mic in Listen tab
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && S.activeTab === 'listen') {
            const tag = document.activeElement.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
            e.preventDefault();
            toggleListening();
        }
    });

    // Initial data load
    refreshDashboard();
    loadOllamaModels();
});
</script>
