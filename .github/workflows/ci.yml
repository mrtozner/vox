name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      # Disable native CPU feature detection so whisper-rs-sys (ggml)
      # doesn't emit i8mm intrinsics unsupported on GitHub's M1 runners.
      CMAKE_ARGS: "-DGGML_NATIVE=OFF"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}

      - name: Install ALSA dev (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Clippy (default features)
        run: cargo clippy -- -D warnings

      - name: Clippy (CLI + server)
        run: cargo clippy --features cli,server -- -D warnings

      - name: Clippy (all portable features)
        run: cargo clippy --features whisper,silero,kokoro,pocket,chatterbox,cli,server -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CMAKE_ARGS: "-DGGML_NATIVE=OFF"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Install ALSA dev (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Unit + integration tests
        run: cargo test

      - name: Build CLI binary
        run: cargo build --features cli --release

      - name: CLI smoke test
        run: |
          ./target/release/vox --version
          ./target/release/vox --help
          ./target/release/vox models list

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ALSA dev
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  python:
    name: Python bindings
    runs-on: macos-latest
    env:
      CMAKE_ARGS: "-DGGML_NATIVE=OFF"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create virtualenv and install deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest

      - name: Build Python wheel
        working-directory: python
        run: |
          source ../.venv/bin/activate
          maturin develop --release

      - name: Run Python tests
        working-directory: python
        run: |
          source ../.venv/bin/activate
          pytest tests/ -v
