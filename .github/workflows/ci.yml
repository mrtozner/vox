name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Quick checks that run on every commit
  quick-check:
    name: Quick Check
    runs-on: ubuntu-latest
    outputs:
      should_test: ${{ steps.filter.outputs.code }}
      should_test_cross_platform: ${{ steps.filter.outputs.cross_platform }}
      should_build_python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4

      - name: Check changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - '**/*.md'
              - 'LICENSE*'
              - 'docs/**'
              - '!CHANGELOG.md'
            code:
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'examples/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            cross_platform:
              - 'src/**/*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
              - '!src/**/*_test.rs'
              - '!**/*.md'
            python:
              - 'python/**'
              - 'src/**'
              - 'Cargo.toml'

      - name: Report filter results
        run: |
          echo "Changed files analysis:"
          echo "  Documentation only: ${{ steps.filter.outputs.docs }}"
          echo "  Code changes: ${{ steps.filter.outputs.code }}"
          echo "  Cross-platform relevant: ${{ steps.filter.outputs.cross_platform }}"
          echo "  Python changes: ${{ steps.filter.outputs.python }}"

  fmt:
    name: Format
    runs-on: ubuntu-latest
    needs: quick-check
    # Always run format check unless it's pure docs changes
    if: needs.quick-check.outputs.should_test == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [quick-check, fmt]
    # Only run cross-platform clippy for code changes
    if: needs.quick-check.outputs.should_test == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Only run Ubuntu by default, expand to all platforms for cross-platform changes
        os: ${{ needs.quick-check.outputs.should_test_cross_platform == 'true' && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Prevent ggml i8mm intrinsic errors on GitHub's ARM runners.
      # armv8.5-a excludes i8mm (introduced in armv8.6-a).
      - name: Pin ARM arch (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "CMAKE_C_FLAGS=-march=armv8.5-a" >> $GITHUB_ENV
          echo "CMAKE_CXX_FLAGS=-march=armv8.5-a" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}

      - name: Install ALSA dev (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Cache LLVM (Windows)
        if: runner.os == 'Windows'
        id: cache-llvm-clippy
        uses: actions/cache@v4
        with:
          path: C:\Program Files\LLVM
          key: llvm-19-windows

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows' && steps.cache-llvm-clippy.outputs.cache-hit != 'true'
        run: choco install llvm -y

      - name: Set LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Clippy (default features)
        run: cargo clippy -- -D warnings

      - name: Clippy (CLI + server)
        run: cargo clippy --features cli,server -- -D warnings

      # Note: 'sherpa' excluded (requires prebuilt native lib), 'piper' excluded
      # (vendor crate has pre-existing lifetime lint incompatible with -D warnings).
      - name: Clippy (all portable features)
        run: cargo clippy --features whisper,silero,kokoro,pocket,chatterbox,cli,server -- -D warnings

      - name: Clippy (qwen3 feature)
        if: runner.os != 'Windows'
        run: cargo clippy --features qwen3 -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [quick-check, fmt]
    # Only run tests if code changed
    if: needs.quick-check.outputs.should_test == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Only run Ubuntu for quick feedback, expand to all platforms for cross-platform changes
        os: ${{ needs.quick-check.outputs.should_test_cross_platform == 'true' && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Pin ARM arch (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "CMAKE_C_FLAGS=-march=armv8.5-a" >> $GITHUB_ENV
          echo "CMAKE_CXX_FLAGS=-march=armv8.5-a" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Install ALSA dev (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Cache LLVM (Windows)
        if: runner.os == 'Windows'
        id: cache-llvm-test
        uses: actions/cache@v4
        with:
          path: C:\Program Files\LLVM
          key: llvm-19-windows

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows' && steps.cache-llvm-test.outputs.cache-hit != 'true'
        run: choco install llvm -y

      - name: Set LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Unit + integration tests
        run: cargo test

      - name: Tests with piper feature
        run: cargo test --features piper
        env:
          RUSTFLAGS: ""

      - name: Tests with qwen3 feature (Unix only)
        if: runner.os != 'Windows'
        run: cargo test --features qwen3 --lib
        env:
          RUSTFLAGS: ""

      - name: Build CLI binary
        run: cargo build --features cli --release

      - name: CLI smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          ./target/release/vox --version
          ./target/release/vox --help
          ./target/release/vox models list

      - name: CLI smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          ./target/release/vox.exe --version
          ./target/release/vox.exe --help
          ./target/release/vox.exe models list

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    needs: quick-check
    # Run doc build if code changed
    if: needs.quick-check.outputs.should_test == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ALSA dev
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  python:
    name: Python bindings
    runs-on: macos-latest
    needs: quick-check
    # Only run if Python files or core code changed
    if: needs.quick-check.outputs.should_build_python == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Pin ARM arch (macOS)
        run: |
          echo "CMAKE_C_FLAGS=-march=armv8.5-a" >> $GITHUB_ENV
          echo "CMAKE_CXX_FLAGS=-march=armv8.5-a" >> $GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create virtualenv and install deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest

      - name: Build Python wheel
        working-directory: python
        run: |
          source ../.venv/bin/activate
          maturin develop --release

      - name: Run Python tests
        working-directory: python
        run: |
          source ../.venv/bin/activate
          pytest tests/ -v

  # Summary job that all branch protection rules should depend on
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [quick-check, fmt, clippy, test, doc, python]
    # Run even if some jobs are skipped, but fail if any required job failed
    if: always()
    steps:
      - name: Check job results
        run: |
          # Check if any required job failed
          if [[ "${{ needs.fmt.result }}" == "failure" ]] || \
             [[ "${{ needs.clippy.result }}" == "failure" ]] || \
             [[ "${{ needs.test.result }}" == "failure" ]] || \
             [[ "${{ needs.doc.result }}" == "failure" ]] || \
             [[ "${{ needs.python.result }}" == "failure" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi

          # Check if jobs were skipped when they should have run
          if [[ "${{ needs.quick-check.outputs.should_test }}" == "true" ]]; then
            if [[ "${{ needs.fmt.result }}" == "skipped" ]] || \
               [[ "${{ needs.clippy.result }}" == "skipped" ]] || \
               [[ "${{ needs.test.result }}" == "skipped" ]]; then
              echo "Required jobs were skipped when code changed"
              exit 1
            fi
          fi

          echo "All required CI checks passed or were appropriately skipped"
