name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: vox
            archive: tar.gz

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: vox
            archive: tar.gz

          - os: macos-13
            target: x86_64-apple-darwin
            artifact: vox
            archive: tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: vox.exe
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock') }}

      # ── Linux dependencies ───────────────────────────────────────────
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev cmake clang

      # ── macOS ARM: pin arch to avoid ggml i8mm intrinsic errors ────
      - name: Pin ARM arch (macOS ARM64)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          echo "CMAKE_C_FLAGS=-march=armv8.5-a" >> $GITHUB_ENV
          echo "CMAKE_CXX_FLAGS=-march=armv8.5-a" >> $GITHUB_ENV

      # ── Windows dependencies ─────────────────────────────────────────
      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          choco install llvm -y
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      # ── Build ────────────────────────────────────────────────────────
      - name: Build release binary
        run: cargo build --features cli --release --target ${{ matrix.target }}

      # ── Strip binary (Linux / macOS) ─────────────────────────────────
      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact }}

      # ── Smoke test ───────────────────────────────────────────────────
      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          ./target/${{ matrix.target }}/release/${{ matrix.artifact }} --version
          ./target/${{ matrix.target }}/release/${{ matrix.artifact }} --help

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          ./target/${{ matrix.target }}/release/${{ matrix.artifact }} --version
          ./target/${{ matrix.target }}/release/${{ matrix.artifact }} --help

      # ── Package ──────────────────────────────────────────────────────
      - name: Determine archive name
        id: archive
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          NAME="vox-${VERSION}-${{ matrix.target }}"
          echo "name=${NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          STAGING="${{ steps.archive.outputs.name }}"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "$STAGING/"
          cp README.md LICENSE-MIT LICENSE-APACHE 2>/dev/null "$STAGING/" || true
          tar czf "$STAGING.tar.gz" "$STAGING"
          echo "ASSET=$STAGING.tar.gz" >> $GITHUB_ENV

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          STAGING="${{ steps.archive.outputs.name }}"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "$STAGING/"
          cp README.md LICENSE-MIT LICENSE-APACHE 2>/dev/null "$STAGING/" || true
          7z a "$STAGING.zip" "$STAGING"
          echo "ASSET=$STAGING.zip" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}
          path: ${{ env.ASSET }}

  # ── Publish GitHub Release ───────────────────────────────────────────
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release assets
        run: ls -lhR artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
